<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Moord in de burcht · puzzelgenerator</title>
<style>
:root{--bg:#f4ead8;--card:#eadcb9;--line:#b49b6b;--ink:#2b2118;--paper:#fff8e6;--red:#b22222;--ok:#2e7d32}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit}
header{position:relative;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding:8px 12px calc(8px) 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;font-variant:small-caps;letter-spacing:1px}
header .case{font-size:13px;opacity:.75;margin-left:6px;font-variant:normal}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:8px 10px;min-height:40px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:#8a6d3b;color:#fff}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
.btn.primary{background:#8a6d3b;color:#fff;border-color:#6b5228}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1280px;margin:0 auto;padding:12px;display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){header{position:sticky}main{grid-template-columns:minmax(320px,1fr) minmax(420px,1.25fr);align-items:start}
  #boardCol{position:sticky;top:76px;order:2} #clueCol{order:1}}
.title{text-align:center;margin:2px 0 0;font-size:24px;font-variant:small-caps;letter-spacing:1px}
.sub{text-align:center;font-style:italic;margin:2px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:14px;position:relative;cursor:pointer;transition:transform .1s}
.card.sel{outline:3px solid #8a6d3b;transform:translateY(-2px)}
.card .face{font-size:34px;line-height:1.1}
.card .tag{display:inline-block;background:var(--paper);border:1px solid #8a7550;border-radius:4px;padding:1px 8px;font-weight:bold;letter-spacing:1px;margin:3px 0;font-size:13px}
.card .placed{position:absolute;top:6px;right:8px;font-size:15px;color:var(--ok)}
.card.victim{background:#e7b3a8;border-color:#a0483b}
.box{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 14px;margin-top:12px;font-size:14px}
.box h3{margin:2px 0 6px;font-size:16px}
.box ul{margin:0;padding-left:18px}
.legend{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.leg{flex:1 1 220px;border-radius:10px;padding:6px 8px;text-align:center;font-size:12px}
.leg.ok{background:#dff0d0;border:2px solid #8fb36b}.leg.no{background:#f6d6c8;border:2px solid #c98b6b}
.li{display:inline-block;margin:3px 6px;font-size:12px;vertical-align:top}
.li svg{width:30px;height:30px;display:block;margin:0 auto}
#board{width:100%;max-width:min(92vw,680px);margin:0 auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#board .hit{cursor:pointer}
.palette{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.tool{border:2px solid var(--line);background:var(--paper);border-radius:999px;min-width:44px;height:44px;padding:0 10px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-weight:bold}
.tool[aria-pressed=true]{background:#8a6d3b;color:#fff;border-color:#6b5228}
.tool .em{font-size:20px}
.tool.done{opacity:.55}
.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.answer{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:8px}
.answer select{border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:8px;min-height:40px}
#msg{min-height:24px;text-align:center;margin:8px 0;font-weight:bold}
#msg.good{color:var(--ok)}#msg.bad{color:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(244,234,216,.85);display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:12px;font-size:18px}
.overlay.on{display:flex}
.spinner{width:46px;height:46px;border:5px solid var(--line);border-top-color:#6b5228;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:12px;opacity:.7;padding:16px}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  header,main,footer,.overlay{display:none!important}
  body{background:#fff}
  #print{display:block}
  .ppage{page-break-after:always;background:var(--bg);border-radius:10px;padding:14px 18px;min-height:268mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ppage:last-child{page-break-after:auto}
  .ppage .cards{grid-template-columns:repeat(3,1fr)}
  .ppage .card{cursor:default}
  .pboard{width:150mm;margin:0 auto;display:block}
  .prow{display:flex;gap:14px;align-items:flex-end;margin-top:10px}
  .pblank{width:92mm}
  .pans{flex:1;border:2px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 14px;font-size:16px}
  .pans div{border-bottom:1.5px solid #333;height:30px}
  .psol{width:110mm;margin:0 auto;display:block}
}

<body>
<header>
  <h1>Moord in de burcht <span class="case" id="caseNo"></span></h1>
  <div class="controls">
    <div class="seg" role="group" aria-label="Moeilijkheid">
      <button data-d="easy" aria-pressed="false">Makkelijk</button>
      <button data-d="medium" aria-pressed="true">Normaal</button>

    </div>
    <button class="btn primary" id="newBtn">Nieuwe zaak</button>

<main>
  <section id="boardCol">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>

</main>
<footer>Kies een verdachte of ✕ hieronder het bord en tik op een vak. Elke zaak heeft precies één oplossing. Deel de link om dezelfde zaak te delen.</footer>

<script id="core">
// ---------- shared core: runs in the page and in the worker ----------
const DIFF={
  easy:  {N:6,K:4,dens:[.30,.42],mode:'easy'},
  medium:{N:8,K:6,dens:[.34,.46],mode:'medium'},
  hard:  {N:9,K:7,dens:[.36,.48],mode:'hard'}
};
const OCC=new Set(['stoel','paard','bank','tapijt','bed','troon']);
const LEN={tapijt:[1,3],tafel:[1,2],bed:[2,2]};
const UNIQUE=new Set(['troon']);
const ROOMS=[
 {name:'Stal',color:'#e6cfa8',occ:['paard','paard','bank'],blk:['ton','hooibaal','kist']},
 {name:'Binnenplaats',color:'#cfe3b4',occ:['bank','paard'],blk:['boom','struik','put']},
 {name:'Bibliotheek',color:'#c9dcef',occ:['stoel','tapijt'],blk:['boekenkast','boekenkast','tafel']},
 {name:'Slaapkamer',color:'#ddd0ec',occ:['bed','stoel','tapijt'],blk:['kast','kist']},
 {name:'Troonzaal',color:'#f1c9c4',occ:['troon','tapijt','stoel'],blk:['harnas','tafel']},
 {name:'Keuken',color:'#f6e6a8',occ:['stoel','bank'],blk:['tafel','ton','kast']},
 {name:'Kapel',color:'#dcdcdc',occ:['bank','tapijt'],blk:['altaar','kandelaar']},
 {name:'Wapenkamer',color:'#d9c9b6',occ:['stoel','bank'],blk:['harnas','wapenrek','kist']},
 {name:'Tuin',color:'#bfe0c0',occ:['bank'],blk:['boom','struik','bloemperk']},
 {name:'Kelder',color:'#cfc6b8',occ:['stoel'],blk:['ton','wijnrek','kist']}
];
const NAMES={A:[['Adelheid','f'],['Arnoud','m']],B:[['Beatrijs','f'],['Boudewijn','m']],C:[['Clementia','f'],['Coenraad','m']],
 D:[['Dirkje','f'],['Diederik','m']],E:[['Ermgard','f'],['Everard','m']],F:[['Fenna','f'],['Floris','m']],
 G:[['Gerlinde','f'],['Gijsbrecht','m']],H:[['Hadewych','f'],['Hugo','m']]};
const VICTIMS=[['Heer Vranck','m'],['Vrouwe Walburga','f']];
const FACES={f:['👸','👩‍🍳','👵','👩‍🦰','👩‍🌾','🧝‍♀️','👩‍🦳','🧕'],m:['🧔','💂','👨‍🦱','🧙','👨‍🍳','🤵','👴','🧑‍🎤']};

function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];

function makeRegions(r,N,K){
  for(let tries=0;tries<200;tries++){
    const reg=Array(N*N).fill(-1);const sizes=Array(K).fill(0);
    const seeds=shuffle(r,[...Array(N*N).keys()]).slice(0,K);
    seeds.forEach((s,i)=>{reg[s]=i;sizes[i]=1});
    let left=N*N-K,guard=0;
    while(left>0&&guard++<100000){
      // favour small regions so sizes stay balanced
      const order=shuffle(r,[...Array(K).keys()]).sort((a,b)=>sizes[a]-sizes[b]+ (r()-.5)*4);
      const k=order[0];const front=[];
      for(let i=0;i<N*N;i++)if(reg[i]===k){const y=Math.floor(i/N),x=i%N;
        for(const[dy,dx]of D4){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<N&&xx>=0&&xx<N&&reg[yy*N+xx]<0)front.push(yy*N+xx)}}
      if(!front.length){sizes[k]+=1000;continue}
      const c=pick(r,front);reg[c]=k;sizes[k]++;left--;
      for(let j=0;j<K;j++)if(sizes[j]>=1000)sizes[j]-=1000;
    }
    const cnt=Array(K).fill(0);reg.forEach(v=>cnt[v]++);
    if(left===0&&Math.min(...cnt)>=3)return reg;
  }
  return null;
}

function buildMap(r,cfg){
  const N=cfg.N,K=cfg.K;
  const reg=makeRegions(r,N,K);if(!reg)return null;
  const rooms=shuffle(r,ROOMS).slice(0,K);
  const obj=Array(N*N).fill(null),objId=Array(N*N).fill(-1),objs=[];const used=new Set();
  for(let k=0;k<K;k++){
    const cells=[];for(let i=0;i<N*N;i++)if(reg[i]===k)cells.push(i);
    const target=Math.round(cells.length*(cfg.dens[0]+r()*(cfg.dens[1]-cfg.dens[0])));
    let filled=0,guard=0;const room=rooms[k];
    while(filled<target&&guard++<200){
      const wantOcc=r()<0.45;let t=pick(r,wantOcc?room.occ:room.blk);
      if(UNIQUE.has(t)&&used.has(t))continue;
      const [lo,hi]=LEN[t]||[1,1];const len=lo+Math.floor(r()*(hi-lo+1));
      if(filled+len>target+1)continue;
      const s=pick(r,cells);const vert=r()<.5;const cs=[];let ok=true;
      for(let j=0;j<len;j++){const y=Math.floor(s/N)+(vert?j:0),x=s%N+(vert?0:j);
        if(y>=N||x>=N){ok=false;break}const i=y*N+x;if(reg[i]!==k||obj[i]){ok=false;break}cs.push(i)}
      if(!ok)continue;
      const id=objs.length;objs.push({t,cells:cs});cs.forEach(i=>{obj[i]=t;objId[i]=id});used.add(t);filled+=len;
    }
    if(!cells.some(i=>!obj[i]||OCC.has(obj[i])))return null;
  }
  return {N,K,reg,obj,objId,objs,rooms:rooms.map(x=>({name:x.name,color:x.color}))};
}

function geom(M){
  const N=M.N,occ=[];
  for(let i=0;i<N*N;i++)if(!M.obj[i]||OCC.has(M.obj[i]))occ.push(i);
  const nb=i=>{const y=Math.floor(i/N),x=i%N,o=[];for(const[dy,dx]of D4){const yy=y+dy,xx=x+dx;
    if(yy>=0&&yy<N&&xx>=0&&xx<N&&M.reg[yy*N+xx]===M.reg[i])o.push(yy*N+xx)}return o};
  const bord=(i,dy,dx)=>{const y=Math.floor(i/N)+dy,x=i%N+dx;return y<0||y>=N||x<0||x>=N||M.reg[y*N+x]!==M.reg[i]};
  const corner=i=>(bord(i,1,0)||bord(i,-1,0))&&(bord(i,0,1)||bord(i,0,-1));
  const edge=i=>{const y=Math.floor(i/N),x=i%N;return y===0||x===0||y===N-1||x===N-1};
  return {occ,nb,corner,edge};
}

function atomsFor(M,G){
  const A={};const types=new Set(M.obj.filter(Boolean));
  for(const t of types){if(OCC.has(t))A['op:'+t]=i=>M.obj[i]===t;
    A['naast:'+t]=i=>G.nb(i).some(q=>M.obj[q]===t)}
  for(let k=0;k<M.K;k++)A['in:'+k]=i=>M.reg[i]===k;
  A['hoek']=G.corner;A['rand']=G.edge;A['geenobject']=i=>!M.obj[i];A['alleen']=()=>true;
  return A;
}

function countSolutions(M,G,A,people,victim,clues,cap,budget){
  const N=M.N;const cand={};
  for(const n of people){
    if(n===victim){cand[n]=G.occ;continue}
    cand[n]=G.occ.filter(i=>clues[n].every(a=>A[a](i)));
    if(!cand[n].length)return {count:0};
  }
  const order=people.slice().sort((a,b)=>cand[a].length-cand[b].length);
  const alone=people.filter(n=>n!==victim&&clues[n].includes('alleen'));
  const pos={};let count=0,nodes=0,first=null,over=false;
  const regCnt=Array(M.K).fill(0);
  function rec(d,rows,cols){
    if(count>=cap||over)return;
    if(++nodes>budget){over=true;return}
    if(d===order.length){
      if(regCnt[M.reg[pos[victim]]]!==2)return;
      for(const n of alone)if(regCnt[M.reg[pos[n]]]!==1)return;
      count++;if(!first)first=Object.assign({},pos);return;
    }
    const n=order[d];
    for(const i of cand[n]){const y=Math.floor(i/N),x=i%N;
      if(rows>>y&1||cols>>x&1)continue;
      pos[n]=i;regCnt[M.reg[i]]++;rec(d+1,rows|1<<y,cols|1<<x);regCnt[M.reg[i]]--;
      if(count>=cap||over)return;}
  }
  rec(0,0,0);
  return {count:over?cap:count,first,over};
}

function placeSolution(r,M,G){
  const N=M.N;const occSet=new Set(G.occ);
  for(let t=0;t<60;t++){
    const colOf=Array(N);const usedC=new Set();
    const rows=[...Array(N).keys()];
    const go=y=>{if(y===N)return true;for(const x of shuffle(r,[...Array(N).keys()])){
      if(usedC.has(x)||!occSet.has(y*N+x))continue;usedC.add(x);colOf[y]=x;if(go(y+1))return true;usedC.delete(x)}return false};
    if(!go(0))return null;
    const cells=rows.map(y=>y*N+colOf[y]);
    const cnt={};cells.forEach(i=>cnt[M.reg[i]]=(cnt[M.reg[i]]||0)+1);
    const vIdx=shuffle(r,cells.map((_,j)=>j)).find(j=>cnt[M.reg[cells[j]]]===2);
    if(vIdx===undefined)continue;
    return {cells,vIdx};
  }
  return null;
}

function generate(seed,diff){
  const cfg=DIFF[diff];
  for(let att=0;att<400;att++){
    const r=rng(seed*7919+att*104729+13);
    const M=buildMap(r,cfg);if(!M)continue;
    const G=geom(M);const A=atomsFor(M,G);
    const P=placeSolution(r,M,G);if(!P)continue;
    const N=M.N;const letters='ABCDEFGH'.slice(0,N-1).split('');
    const fpool=shuffle(r,FACES.f),mpool=shuffle(r,FACES.m);
    const sus=letters.map(L=>{const [nm,g]=pick(r,NAMES[L]);return {name:nm,g,face:(g==='f'?fpool:mpool).pop()}});
    const [vn,vg]=pick(r,VICTIMS);const vic={name:vn,g:vg,face:vg==='f'?'👸':'🤴',victim:true};
    const others=shuffle(r,P.cells.filter((_,j)=>j!==P.vIdx));
    const sol={};sus.forEach((s,j)=>sol[s.name]=others[j]);sol[vic.name]=P.cells[P.vIdx];
    const people=sus.map(s=>s.name).concat(vic.name);
    const regCnt={};Object.values(sol).forEach(i=>regCnt[M.reg[i]]=(regCnt[M.reg[i]]||0)+1);
    const truth={},strength={};
    for(const a in A)strength[a]=a==='alleen'?G.occ.length*0.6:G.occ.filter(A[a]).length;
    for(const s of sus){const i=sol[s.name];
      truth[s.name]=Object.keys(A).filter(a=>a==='alleen'?regCnt[M.reg[i]]===1:A[a](i)).filter(a=>strength[a]<G.occ.length)}
    const res=chooseClues(r,cfg.mode,M,G,A,people,vic.name,sus,truth,strength);
    if(!res)continue;
    const killer=people.find(n=>n!==vic.name&&M.reg[sol[n]]===M.reg[sol[vic.name]]);
    return {seed,diff,M,sus,vic,sol,clues:res,killer};
  }
  return null;
}

function chooseClues(r,mode,M,G,A,people,victim,sus,truth,strength){
  const names=sus.map(s=>s.name);const BUD=40000;
  const cnt=(cl,cap)=>countSolutions(M,G,A,people,victim,cl,cap,BUD).count;
  const clues={};
  for(const n of names){
    const t=truth[n].slice().sort((a,b)=>strength[a]-strength[b]);
    if(!t.length)return null;
    let pool=mode==='easy'?t.slice(0,Math.max(1,Math.ceil(t.length/3))):t.slice(0,Math.max(1,Math.ceil(t.length*2/3)));
    clues[n]=[pick(r,pool)];
  }
  let c=cnt(clues,60);
  for(let it=0;it<40&&c!==1;it++){
    let best=null;
    for(const n of shuffle(r,names)){
      const opts=truth[n].map(a=>[a]);
      if(clues[n].length===1)truth[n].forEach(a=>{if(a!==clues[n][0])opts.push([clues[n][0],a])});
      for(const o of opts){
        if(o.length===clues[n].length&&o.every((a,j)=>a===clues[n][j]))continue;
        const t=Object.assign({},clues);t[n]=o;const k=cnt(t,c);
        if(k<1||k>=c)continue;
        const weak=o.reduce((s,a)=>s+Math.log(strength[a]+1),0)-(o.length-1)*1.5;
        let score;
        if(mode==='easy')score=[k,-weak*0.01,r()];
                else score=[k,o.length,r()];
        if(!best||cmp(score,best.score)<0)best={score,n,o,k};
      }
    }
    if(!best)return null;
    clues[best.n]=best.o;c=best.k;
  }
  if(c!==1)return null;
  const rounds=mode==='hard'?3:mode==='medium'?1:0;
  for(let rd=0;rd<rounds;rd++){ // loosen clues while the answer stays unique
    for(const n of shuffle(r,names)){
      const alts=truth[n].map(a=>[a]).filter(o=>!(o.length===clues[n].length&&o[0]===clues[n][0]))
        .sort((a,b)=>strength[b[0]]-strength[a[0]]);
      const curW=clues[n].length>1?-1:strength[clues[n][0]];
      for(const o of alts){if(clues[n].length===1&&strength[o[0]]<=curW)break;
        const t=Object.assign({},clues);t[n]=o;if(cnt(t,2)===1){clues[n]=o;break}}
    }
  }
  const fin=countSolutions(M,G,A,people,victim,clues,2,3000000);
  if(fin.over||fin.count!==1)return null;
  return clues;
}
function cmp(a,b){for(let i=0;i<a.length;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1}return 0}
</script>

<script>
// ---------- page ----------
const $=s=>document.querySelector(s);
const EMO={paard:'🐎',kist:'📦',ton:'🛢️',hooibaal:'🌾',boom:'🌳',struik:'🌿',boekenkast:'📚',kast:'🗄️',harnas:'🛡️',kandelaar:'🕯️',stoel:'🪑',wapenrek:'🗡️',bloemperk:'🌷',wijnrek:'🍷'};
const LABEL={stoel:'Stoel',paard:'Paard',bank:'Bank',tapijt:'Tapijt',bed:'Bed',troon:'Troon',tafel:'Tafel',kast:'Kast',boekenkast:'Boekenkast',kist:'Kist',ton:'Ton',hooibaal:'Hooibaal',boom:'Boom',struik:'Struik',put:'Put',harnas:'Harnas',altaar:'Altaar',kandelaar:'Kandelaar',wapenrek:'Wapenrek',bloemperk:'Bloemperk',wijnrek:'Wijnrek'};
const OPTXT={stoel:'op een <b>stoel</b>',paard:'op een <b>paard</b>',bank:'op een <b>bank</b>',tapijt:'op een <b>tapijt</b>',bed:'op een <b>bed</b>',troon:'op de <b>troon</b>'};
const OPVERB={stoel:'Zat',paard:'Zat',bank:'Zat',tapijt:'Stond',bed:'Lag',troon:'Zat'};
const SUBS=['Het hof wilde een feestmaal. Het kreeg een lijk.','De ophaalbrug ging omhoog. Niemand kwam er meer uit.','Iemand in de burcht speelt een gevaarlijk spel.','Het bal was nog niet begonnen toen het gegil klonk.','De hofnar lacht niet meer.'];
let P=null,diff='medium',tool=null,state={},marks={},checked=false,showSol=false;
const CS=60,MG=8;

function frag(a,n,first){
  const [k,v]=a.split(':');const g=P.sus.find(s=>s.name===n).g;const pr=g==='f'?'haar':'zijn';
  if(k==='op')return first?`${OPVERB[v]} ${OPTXT[v]}`:OPTXT[v];
  if(k==='in'){const nm=P.M.rooms[+v].name.toLowerCase();return (first?'Was in de ':'in de ')+`<b>${nm}</b>`}
  if(k==='naast')return (first?'Bevond zich ':'')+`<b>naast</b> ${v==='troon'?'de':'een'} <b>${v}</b>`;
  if(k==='hoek')return (first?'Bevond zich ':'')+`in een <b>hoek</b> van ${pr} <b>gebied</b>`;
  if(k==='rand')return (first?'Bevond zich ':'')+`aan de <b>rand</b> van het raster`;
  if(k==='geenobject')return (first?'Stond ':'')+`<b>niet</b> op een object`;
  if(k==='alleen')return (first?'Was ':'')+`<b>alleen</b> in ${pr} gebied`;
}
const PRI=['op','in','naast','hoek','rand','geenobject','alleen'];
function clueText(n){const a=P.clues[n].slice().sort((x,y)=>PRI.indexOf(x.split(':')[0])-PRI.indexOf(y.split(':')[0]));
  return a.map((x,j)=>frag(x,n,j===0)).join(', ')+'.'}

function objSVG(t,x0,y0,w,h){
  const cx=x0+w/2,cy=y0+h/2;
  if(t==='tapijt')return `<rect x="${x0+7}" y="${y0+7}" width="${w-14}" height="${h-14}" fill="#d9534f" stroke="#7a1f1c" stroke-width="2"/><rect x="${x0+13}" y="${y0+13}" width="${w-26}" height="${h-26}" fill="none" stroke="#f3c969" stroke-width="2"/>`;
  if(t==='tafel')return `<rect x="${x0+8}" y="${y0+8}" width="${w-16}" height="${h-16}" rx="4" fill="#8b5a2b" stroke="#4a2f14" stroke-width="2"/>`;
  if(t==='bed'){const v=h>w;return `<rect x="${x0+6}" y="${y0+6}" width="${w-12}" height="${h-12}" rx="6" fill="#f5f5f5" stroke="#6b4a2b" stroke-width="3"/>`+
    (v?`<rect x="${x0+14}" y="${y0+12}" width="${w-28}" height="20" rx="6" fill="#fff" stroke="#999"/><rect x="${x0+9}" y="${y0+40}" width="${w-18}" height="${h-49}" rx="4" fill="#7da7d9"/>`
      :`<rect x="${x0+12}" y="${y0+14}" width="20" height="${h-28}" rx="6" fill="#fff" stroke="#999"/><rect x="${x0+40}" y="${y0+9}" width="${w-49}" height="${h-18}" rx="4" fill="#7da7d9"/>`)}
  if(t==='bank')return `<rect x="${x0+8}" y="${y0+20}" width="${w-16}" height="16" rx="3" fill="#a0703f" stroke="#4a2f14" stroke-width="2"/><rect x="${x0+12}" y="${y0+36}" width="5" height="12" fill="#4a2f14"/><rect x="${x0+w-17}" y="${y0+36}" width="5" height="12" fill="#4a2f14"/>`;
  if(t==='put')return `<circle cx="${cx}" cy="${cy}" r="21" fill="#8c8c8c" stroke="#444" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="13" fill="#3f7fbf"/>`;
  if(t==='altaar')return `<rect x="${x0+10}" y="${y0+16}" width="${w-20}" height="${h-26}" fill="#eee" stroke="#666" stroke-width="2"/><text x="${cx}" y="${cy+8}" font-size="22" text-anchor="middle" fill="#b8860b">✝</text>`;
  if(t==='troon')return `<text x="${cx}" y="${cy+13}" font-size="34" text-anchor="middle">🪑</text><text x="${cx+14}" y="${cy-10}" font-size="17" text-anchor="middle">👑</text>`;
  return `<text x="${cx}" y="${cy+12}" font-size="34" text-anchor="middle">${EMO[t]||'?'}</text>`;
}

function boardSVG(opt={}){
  const M=P.M,N=M.N,W=N*CS+2*MG;const o=[];
  for(let i=0;i<N*N;i++){const y=Math.floor(i/N),x=i%N;const X=MG+x*CS,Y=MG+y*CS;
    let fill=opt.blank?'#fff':M.rooms[M.reg[i]].color;
    if(opt.blank&&M.obj[i]&&!OCC.has(M.obj[i]))fill='#9a9a9a';
    o.push(`<rect x="${X}" y="${Y}" width="${CS}" height="${CS}" fill="${fill}" stroke="#555" stroke-width="0.8"/>`)}
  for(const ob of M.objs){const ys=ob.cells.map(i=>Math.floor(i/N)),xs=ob.cells.map(i=>i%N);
    const x0=MG+Math.min(...xs)*CS,y0=MG+Math.min(...ys)*CS,w=(Math.max(...xs)-Math.min(...xs)+1)*CS,h=(Math.max(...ys)-Math.min(...ys)+1)*CS;
    if(opt.blank){if(OCC.has(ob.t))o.push(`<rect x="${x0+9}" y="${y0+9}" width="${w-18}" height="${h-18}" rx="8" fill="none" stroke="#777" stroke-width="1.6"/>`);continue}
    o.push(objSVG(ob.t,x0,y0,w,h))}
  for(let i=0;i<N*N;i++){const y=Math.floor(i/N),x=i%N;const X=MG+x*CS,Y=MG+y*CS;
    if(x+1<N&&M.reg[i+1]!==M.reg[i])o.push(`<line x1="${X+CS}" y1="${Y}" x2="${X+CS}" y2="${Y+CS}" stroke="#222" stroke-width="5" stroke-linecap="round"/>`);
    if(y+1<N&&M.reg[i+N]!==M.reg[i])o.push(`<line x1="${X}" y1="${Y+CS}" x2="${X+CS}" y2="${Y+CS}" stroke="#222" stroke-width="5" stroke-linecap="round"/>`)}
  o.push(`<rect x="${MG}" y="${MG}" width="${N*CS}" height="${N*CS}" fill="none" stroke="#222" stroke-width="6"/>`);
  if(!opt.blank)for(let k=0;k<M.K;k++){ // label on the lowest free cell of each region
    let best=-1;for(let i=0;i<N*N;i++)if(M.reg[i]===k){const sc=(M.obj[i]?0:1000)+Math.floor(i/N)*20-(i%N);if(best<0||sc>bestS){best=i;var bestS=sc}}
    const nm=M.rooms[k].name.toUpperCase();const w=nm.length*6.6+8;const X=MG+(best%N)*CS+3,Y=MG+(Math.floor(best/N)+1)*CS-12;
    o.push(`<rect x="${X}" y="${Y-8}" width="${w}" height="16" rx="3" fill="#fff" stroke="#333" stroke-width="1"/><text x="${X+w/2}" y="${Y+4}" font-size="10" font-family="Georgia,serif" text-anchor="middle" letter-spacing=".4">${nm}</text>`)}
  if(opt.marks){
    const pos=opt.marks;const rowsUsed={},colsUsed={};
    for(const n in pos){const i=pos[n];const y=Math.floor(i/N),x=i%N;(rowsUsed[y]=rowsUsed[y]||[]).push(n);(colsUsed[x]=colsUsed[x]||[]).push(n)}
    for(const i in (opt.x||{})){const y=Math.floor(i/N),x=i%N;const X=MG+x*CS,Y=MG+y*CS;
      o.push(`<path d="M${X+16} ${Y+16}L${X+CS-16} ${Y+CS-16}M${X+CS-16} ${Y+16}L${X+16} ${Y+CS-16}" stroke="#333" stroke-width="6" stroke-linecap="round" opacity=".8"/>`)}
    for(const n in pos){const i=pos[n];const y=Math.floor(i/N),x=i%N;const cx=MG+x*CS+CS/2,cy=MG+y*CS+CS/2;
      const bad=opt.conflicts&&(rowsUsed[y].length>1||colsUsed[x].length>1);
      const red=opt.solution&&(n===P.vic.name||n===P.killer);
      const col=bad?'#d32f2f':red?'#b22222':'#222';
      o.push(`<circle cx="${cx}" cy="${cy}" r="18" fill="#fff" stroke="${col}" stroke-width="${bad?4:3}"/><text x="${cx}" y="${cy+7}" font-size="20" font-weight="bold" text-anchor="middle" fill="${col}" font-family="Georgia,serif">${n==='Heer Vranck'||n==='Vrouwe Walburga'?'V':n[0]}</text>`)}
  }
  if(opt.hit)for(let i=0;i<N*N;i++){const y=Math.floor(i/N),x=i%N;o.push(`<rect class="hit" data-i="${i}" x="${MG+x*CS}" y="${MG+y*CS}" width="${CS}" height="${CS}" fill="transparent"/>`)}
  return {inner:o.join(''),vb:`0 0 ${W} ${W}`};
}
function svgStr(opt,cls){const b=boardSVG(opt);return `<svg class="${cls}" viewBox="${b.vb}" xmlns="http://www.w3.org/2000/svg">${b.inner}</svg>`}

function letter(n){return n===P.vic.name?'V':n[0]}
function people(){return P.sus.map(s=>s.name).concat(P.vic.name)}

function renderBoard(){
  const b=boardSVG({marks:showSol?P.sol:state,x:showSol?{}:marks,conflicts:!showSol,solution:showSol,hit:true});
  const svg=$('#board');svg.setAttribute('viewBox',b.vb);svg.innerHTML=b.inner;
  // palette
  const pal=$('#palette');pal.innerHTML='';
  const mk=(id,html,label)=>{const btn=document.createElement('button');btn.className='tool';btn.innerHTML=html;btn.setAttribute('aria-label',label);
    btn.setAttribute('aria-pressed',tool===id);if(id!=='X'&&id!=='erase'&&state[id]!==undefined)btn.classList.add('done');
    btn.onclick=()=>{tool=tool===id?null:id;renderBoard();renderCards()};pal.appendChild(btn)};
  for(const s of P.sus)mk(s.name,`<span class="em">${s.face}</span>${s.name[0]}`,s.name);
  mk(P.vic.name,`<span class="em">${P.vic.face}</span>V`,P.vic.name);
  mk('X','<span class="em">✕</span>','Vak schrappen');
  mk('erase','<span class="em">⌫</span>','Gum');
}
function renderCards(){
  const c=$('#cards');c.innerHTML='';
  for(const s of P.sus.concat([P.vic])){
    const d=document.createElement('div');d.className='card'+(s.victim?' victim':'')+(tool===s.name?' sel':'');
    d.innerHTML=`${state[s.name]!==undefined?'<span class="placed">✓</span>':''}<div class="face">${s.face}</div><div class="tag">${s.name.toUpperCase()}</div><div class="txt">${s.victim?'<b>Het slachtoffer</b><br>Was alleen met '+(s.g==='f'?'haar':'zijn')+' moordenaar.':clueText(s.name)}</div>`;
    d.onclick=()=>{tool=tool===s.name?null:s.name;renderBoard();renderCards();if(innerWidth<900)$('#board').scrollIntoView({behavior:'smooth',block:'start'})};
    c.appendChild(d)}
}
function iconSVG(t){const o=objSVG(t,0,0,60,60);return `<svg viewBox="0 0 60 60">${o}</svg>`}
function renderStatic(){
  $('#caseNo').textContent=`· zaak ${P.seed}`;
  $('#title').textContent=`Zaak ${P.seed}: moord op ${P.vic.name.toLowerCase().replace('heer ','heer ').replace(/^./,c=>c.toUpperCase())}`;
  $('#sub').textContent=SUBS[P.seed%SUBS.length];
  const types=[...new Set(P.M.obj.filter(Boolean))];
  const occ=types.filter(t=>OCC.has(t)),blk=types.filter(t=>!OCC.has(t));
  $('#legend').innerHTML=`<div class="leg ok"><b>Kunnen worden bezet</b><br>${occ.map(t=>`<span class="li">${iconSVG(t)}${LABEL[t]}</span>`).join('')}</div>`+
    `<div class="leg no"><b>Kunnen niet worden bezet</b><br>${blk.map(t=>`<span class="li">${iconSVG(t)}${LABEL[t]}</span>`).join('')}</div>`;
  $('#rules').innerHTML=`<li>Iedere persoon staat in een eigen <b>rij</b> en een eigen <b>kolom</b>.</li>
<li>Je kunt alleen op een leeg vak of op een object uit het groene vak staan.</li>
<li><b>Naast</b> betekent direct boven, onder, links of rechts, <b>in hetzelfde gebied</b>.</li>
<li>Een <b>hoek van een gebied</b> is een vak waar twee grenzen van dat gebied samenkomen. De buitenrand telt als grens.</li>
<li><b>Alleen</b> betekent: niemand anders in hetzelfde gebied.</li>
<li>Het slachtoffer was alleen met de moordenaar.</li>`;
  const sel=$('#killer');sel.innerHTML='<option value="">— kies —</option>'+P.sus.map(s=>`<option>${s.name}</option>`).join('');
}
function renderAll(){renderStatic();renderBoard();renderCards();save()}

$('#board').addEventListener('click',e=>{
  const t=e.target.closest('.hit');if(!t||showSol)return;const i=+t.dataset.i;
  const occAt=Object.keys(state).find(n=>state[n]===i);
  if(!tool){if(occAt){delete state[occAt]}else if(marks[i])delete marks[i];else marks[i]=1}
  else if(tool==='X'){if(marks[i])delete marks[i];else{marks[i]=1;if(occAt)delete state[occAt]}}
  else if(tool==='erase'){delete marks[i];if(occAt)delete state[occAt]}
  else{
    const g=geom(P.M);if(!g.occ.includes(i)){msg('Daar kan niemand staan.','bad');return}
    if(occAt===tool){delete state[tool]}else{if(occAt)delete state[occAt];state[tool]=i;delete marks[i]}
  }
  msg('');renderBoard();renderCards();save();
});

function msg(t,c=''){const m=$('#msg');m.textContent=t;m.className=c}
$('#checkBtn').onclick=()=>{
  const ppl=people();const placed=ppl.filter(n=>state[n]!==undefined).length;
  const wrong=ppl.filter(n=>state[n]!==undefined&&state[n]!==P.sol[n]).length;
  const k=$('#killer').value;
  if(placed<ppl.length){msg(wrong?`Nog niet compleet, en ${wrong} ${wrong===1?'persoon staat':'personen staan'} verkeerd.`:`Tot nu toe goed. Nog ${ppl.length-placed} te plaatsen.`,wrong?'bad':'');return}
  if(wrong){msg(`${wrong} ${wrong===1?'persoon staat':'personen staan'} verkeerd.`,'bad');return}
  if(!k){msg('Het bord klopt! Kies nu de moordenaar.','good');return}
  msg(k===P.killer?`Opgelost! ${P.killer} is de moordenaar. 🎉`:`Het bord klopt, maar ${k} is niet de moordenaar.`,k===P.killer?'good':'bad');
};
$('#hintBtn').onclick=()=>{
  const ppl=people();const wrong=ppl.find(n=>state[n]!==undefined&&state[n]!==P.sol[n]);
  if(wrong){msg(`${wrong} staat niet goed.`,'bad');return}
  const todo=P.sus.map(s=>s.name).concat(P.vic.name).find(n=>state[n]===undefined);
  if(!todo){msg('Alles staat al. Kies de moordenaar.');return}
  state[todo]=P.sol[todo];delete marks[P.sol[todo]];msg(`${todo} is geplaatst.`);renderBoard();renderCards();save();
};
$('#clearBtn').onclick=()=>{if(!confirm('Alles wissen?'))return;state={};marks={};showSol=false;msg('');renderBoard();renderCards();save()};
$('#solveBtn').onclick=()=>{showSol=!showSol;$('#solveBtn').textContent=showSol?'Verberg oplossing':'Oplossing';
  msg(showSol?`${P.killer} was alleen met ${P.vic.name} in de ${P.M.rooms[P.M.reg[P.sol[P.vic.name]]].name.toLowerCase()}.`:'');renderBoard()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{diff=b.dataset.d;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));newCase()});
$('#newBtn').onclick=()=>newCase();
$('#printBtn').onclick=()=>{buildPrint();setTimeout(()=>print(),50)};

function buildPrint(){
  const withSol=confirm('Oplossing op een aparte pagina meeprinten?');
  const cards=$('#cards').innerHTML.replace(/<span class="placed">✓<\/span>/g,'').replace(/ sel"/g,'"');
  $('#print').innerHTML=`<div class="ppage"><h2 class="title">${$('#title').textContent}</h2><p class="sub">${$('#sub').textContent}</p>
  <div class="cards">${cards}</div><div class="box"><h3>Spelregels</h3><ul>${$('#rules').innerHTML}</ul></div><div class="legend">${$('#legend').innerHTML}</div></div>
  <div class="ppage">${svgStr({},'pboard')}<div class="prow">${svgStr({blank:true},'pblank')}<div class="pans">De moordenaar is …<div></div></div></div></div>`+
  (withSol?`<div class="ppage"><h2 class="title">Oplossing zaak ${P.seed}</h2>${svgStr({marks:P.sol,solution:true},'psol')}<p class="sub" style="margin-top:12px">${P.killer} was alleen met ${P.vic.name} en is de moordenaar.</p></div>`:'');
}

function save(){try{localStorage.setItem('murdoku:'+diff+':'+P.seed,JSON.stringify({state,marks}));localStorage.setItem('murdoku:last',location.hash)}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('murdoku:'+diff+':'+P.seed)||'null');if(s){state=s.state||{};marks=s.marks||{}}}catch(e){}}

// generation: in a worker when possible, so the page stays responsive
let worker=null;
function makeWorker(){
  try{const src=$('#core').textContent+`;onmessage=e=>{const r=generate(e.data.seed,e.data.diff);postMessage(r)}`;
    return new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})))}catch(e){return null}
}
function genAsync(seed,d){
  return new Promise(res=>{
    if(worker===null)worker=makeWorker()||false;
    if(!worker){setTimeout(()=>res(generate(seed,d)),30);return}
    let done=false;
    worker.onmessage=e=>{done=true;res(e.data)};
    worker.onerror=()=>{if(done)return;done=true;worker=false;res(generate(seed,d))};
    worker.postMessage({seed,diff:d});
  });
}
async function openCase(seed,d){
  $('#busy').classList.add('on');
  let g=null;for(let k=0;k<5&&!g;k++){g=await genAsync(seed,d);if(!g)seed=seed+1}
  $('#busy').classList.remove('on');
  if(!g){msg('Dat lukte niet. Probeer een nieuwe zaak.','bad');return}
  P=g;diff=d;state={};marks={};showSol=false;tool=null;$('#solveBtn').textContent='Oplossing';msg('');
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.d===d));
  history.replaceState(null,'',`#${d}-${seed}`);load();renderAll();
}
function newCase(){openCase(1+Math.floor(Math.random()*99999),diff)}
function fromHash(){const m=/^#(easy|medium|hard)-(\d+)$/.exec(location.hash);if(m){openCase(+m[2],m[1]);return true}return false}
window.addEventListener('hashchange',()=>{if(!P||location.hash!==`#${P.diff}-${P.seed}`)fromHash()});
if(!fromHash()){const last=(()=>{try{return localStorage.getItem('murdoku:last')}catch(e){return null}})();
  if(last&&/^#(easy|medium|hard)-\d+$/.test(last)){location.hash=last}else openCase(75,'medium')}
</script>
