<style>
:root{--gold:#e8c272;--gold2:#a8803a;--glass:rgba(20,14,34,.72);--ink:#f3e9d2;--red:#e0503c;--ok:#7ed37e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#120d22;color:var(--ink);font-family:"EB Garamond",Georgia,serif}
button,select{font:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(232,194,114,.35);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
header{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;z-index:5}
h1{margin:0;font-family:Cinzel,Georgia,serif;font-weight:800;font-size:18px;letter-spacing:1.5px;background:linear-gradient(180deg,#fff1c9,#d9a441);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(232,194,114,.25)}

.seg button{border:0;background:transparent;padding:7px 10px;min-height:38px;cursor:pointer;font-family:Cinzel,serif;font-size:12px;letter-spacing:.5px}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#e8c272,#a8803a);color:#1b1206}
.btn{border:1px solid var(--gold2);background:rgba(255,255,255,.04);border-radius:10px;padding:7px 12px;min-height:38px;cursor:pointer;font-family:Cinzel,serif;font-size:12px;letter-spacing:.5px}

#hud.notes .seg.mode button[aria-pressed=true]{background:linear-gradient(180deg,#bfe2ff,#5d9bd6);color:#08182a}
#hud.notes .chip[aria-pressed=true]{background:linear-gradient(180deg,#bfe2ff,#5d9bd6);border-color:#dff0ff;box-shadow:0 0 16px rgba(159,208,255,.6)}
#cluebar .mode-tag{font-family:Cinzel,serif;font-size:11px;letter-spacing:1px;color:#9fd0ff;border:1px solid #5d9bd6;border-radius:6px;padding:1px 6px;margin-right:6px;white-space:nowrap}
#more{position:absolute;right:8px;bottom:calc(100% + 8px);display:none;flex-direction:column;gap:6px;padding:8px;min-width:160px}

  .seg button{padding:6px 8px;font-size:11px;min-height:34px}.btn{padding:6px 9px;font-size:11px;min-height:34px}
  #hud{padding:6px;gap:6px}#cluebar{min-height:36px}#cluebar .tx{font-size:14px}#cluebar .face{font-size:24px}
  .chip{height:40px;min-width:40px}.chip .dot{width:26px;height:26px;font-size:15px}

}

  #dossier.open{transform:none}

.modal h3{font-family:Cinzel,serif;color:var(--gold);margin:0 0 10px;letter-spacing:1px}
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.sus button{border:1px solid var(--gold2);background:rgba(255,255,255,.05);border-radius:12px;padding:8px;cursor:pointer}
.sus button span{display:block;font-size:30px}
#loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#2a1d48,#0c0816);transition:opacity .5s}
#loader.off{opacity:0;pointer-events:none}
#loader .t{font-family:Cinzel,serif;font-size:22px;color:var(--gold);letter-spacing:2px}
.sigil{width:60px;height:60px;border:3px solid rgba(232,194,114,.25);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<body>
<canvas id="c"></canvas>
<header class="glass">
  <h1>Moord in de burcht <small id="caseNo"></small></h1>
  <div class="row">
    <div class="seg" role="group" aria-label="Moeilijkheid">
      <button data-d="easy">Makkelijk</button><button data-d="medium" aria-pressed="true">Normaal</button><button data-d="hard">Moeilijk</button>
    </div>
    <button class="btn gold" id="newBtn">Nieuwe zaak</button>
  </div>
</header>

<aside id="dossier" class="glass">
  <button class="btn close" id="closeDoss">Sluiten</button>
  <h2 id="title"></h2><p class="sub" id="sub"></p>
  <div class="cards" id="cards"></div>
  <div class="rules"><h3>Spelregels</h3><ul id="rules"></ul></div>
  <div class="legend" id="legend"></div>
  <p style="text-align:center;margin-top:12px"><a id="printLink" class="btn" style="text-decoration:none;display:inline-block" href="../">Afdrukken (klassieke versie)</a></p>
</aside>

<div id="hud" class="glass">
  <div id="cluebar"></div>
  <div id="palette"></div>
  <div id="actions">
    <div class="seg mode" role="group" aria-label="Invoer">
      <button data-m="pen" aria-pressed="true" title="Pion plaatsen (N wisselt)">♟ Pion</button><button data-m="notes" title="Notities maken (N wisselt)">✎ Notitie</button>
    </div>
    <button class="btn icon" id="undoBtn" aria-label="Ongedaan maken" title="Ongedaan maken (Z)">↶</button>
    <button class="btn" id="camBtn">Boven</button>
    <button class="btn" id="dossBtn">Dossier</button>

  </div>
  <div id="more" class="glass">
    <button class="btn" id="hintBtn">Hint</button>
    <button class="btn" id="solveBtn">Oplossing</button>
    <button class="btn" id="clearNotesBtn">Wis notities</button>
    <button class="btn" id="clearBtn">Wis alles</button>
  </div>
</div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
<div class="modal" id="accuse"><div class="glass"><h3>Wie is de moordenaar?</h3><div class="sus" id="susList"></div><button class="btn" id="accuseCancel">Annuleren</button></div></div>
<div id="loader"><div class="sigil"></div><div class="t">Moord in de burcht</div><div id="loadTxt">De burcht wordt gebouwd…</div></div>

<script id="core">
// ---------- shared core: runs in the page and in the worker ----------
const DIFF={
  easy:  {N:6,K:4,dens:[.30,.42],mode:'easy'},
  medium:{N:8,K:6,dens:[.34,.46],mode:'medium'},
  hard:  {N:9,K:7,dens:[.36,.48],mode:'hard'}
};
const OCC=new Set(['stoel','paard','bank','tapijt','bed','troon']);
const LEN={tapijt:[1,3],tafel:[1,2],bed:[2,2]};
const UNIQUE=new Set(['troon']);
const ROOMS=[
 {name:'Stal',color:'#e6cfa8',occ:['paard','paard','bank'],blk:['ton','hooibaal','kist']},
 {name:'Binnenplaats',color:'#cfe3b4',occ:['bank','paard'],blk:['boom','struik','put']},
 {name:'Bibliotheek',color:'#c9dcef',occ:['stoel','tapijt'],blk:['boekenkast','boekenkast','tafel']},
 {name:'Slaapkamer',color:'#ddd0ec',occ:['bed','stoel','tapijt'],blk:['kast','kist']},
 {name:'Troonzaal',color:'#f1c9c4',occ:['troon','tapijt','stoel'],blk:['harnas','tafel']},
 {name:'Keuken',color:'#f6e6a8',occ:['stoel','bank'],blk:['tafel','ton','kast']},
 {name:'Kapel',color:'#dcdcdc',occ:['bank','tapijt'],blk:['altaar','kandelaar']},
 {name:'Wapenkamer',color:'#d9c9b6',occ:['stoel','bank'],blk:['harnas','wapenrek','kist']},
 {name:'Tuin',color:'#bfe0c0',occ:['bank'],blk:['boom','struik','bloemperk']},
 {name:'Kelder',color:'#cfc6b8',occ:['stoel'],blk:['ton','wijnrek','kist']}
];
const NAMES={A:[['Adelheid','f'],['Arnoud','m']],B:[['Beatrijs','f'],['Boudewijn','m']],C:[['Clementia','f'],['Coenraad','m']],
 D:[['Dirkje','f'],['Diederik','m']],E:[['Ermgard','f'],['Everard','m']],F:[['Fenna','f'],['Floris','m']],
 G:[['Gerlinde','f'],['Gijsbrecht','m']],H:[['Hadewych','f'],['Hugo','m']]};
const VICTIMS=[['Heer Vranck','m'],['Vrouwe Walburga','f']];
const FACES={f:['👸','👩‍🍳','👵','👩‍🦰','👩‍🌾','🧝‍♀️','👩‍🦳','🧕'],m:['🧔','💂','👨‍🦱','🧙','👨‍🍳','🤵','👴','🧑‍🎤']};

function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];

function makeRegions(r,N,K){
  for(let tries=0;tries<200;tries++){
    const reg=Array(N*N).fill(-1);const sizes=Array(K).fill(0);
    const seeds=shuffle(r,[...Array(N*N).keys()]).slice(0,K);
    seeds.forEach((s,i)=>{reg[s]=i;sizes[i]=1});
    let left=N*N-K,guard=0;
    while(left>0&&guard++<100000){
      // favour small regions so sizes stay balanced
      const order=shuffle(r,[...Array(K).keys()]).sort((a,b)=>sizes[a]-sizes[b]+ (r()-.5)*4);
      const k=order[0];const front=[];
      for(let i=0;i<N*N;i++)if(reg[i]===k){const y=Math.floor(i/N),x=i%N;
        for(const[dy,dx]of D4){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<N&&xx>=0&&xx<N&&reg[yy*N+xx]<0)front.push(yy*N+xx)}}
      if(!front.length){sizes[k]+=1000;continue}
      const c=pick(r,front);reg[c]=k;sizes[k]++;left--;
      for(let j=0;j<K;j++)if(sizes[j]>=1000)sizes[j]-=1000;
    }
    const cnt=Array(K).fill(0);reg.forEach(v=>cnt[v]++);
    if(left===0&&Math.min(...cnt)>=3)return reg;
  }
  return null;
}

function buildMap(r,cfg){
  const N=cfg.N,K=cfg.K;
  const reg=makeRegions(r,N,K);if(!reg)return null;
  const rooms=shuffle(r,ROOMS).slice(0,K);
  const obj=Array(N*N).fill(null),objId=Array(N*N).fill(-1),objs=[];const used=new Set();
  for(let k=0;k<K;k++){
    const cells=[];for(let i=0;i<N*N;i++)if(reg[i]===k)cells.push(i);
    const target=Math.round(cells.length*(cfg.dens[0]+r()*(cfg.dens[1]-cfg.dens[0])));
    let filled=0,guard=0;const room=rooms[k];
    while(filled<target&&guard++<200){
      const wantOcc=r()<0.45;let t=pick(r,wantOcc?room.occ:room.blk);
      if(UNIQUE.has(t)&&used.has(t))continue;
      const [lo,hi]=LEN[t]||[1,1];const len=lo+Math.floor(r()*(hi-lo+1));
      if(filled+len>target+1)continue;
      const s=pick(r,cells);const vert=r()<.5;const cs=[];let ok=true;
      for(let j=0;j<len;j++){const y=Math.floor(s/N)+(vert?j:0),x=s%N+(vert?0:j);
        if(y>=N||x>=N){ok=false;break}const i=y*N+x;if(reg[i]!==k||obj[i]){ok=false;break}cs.push(i)}
      if(!ok)continue;
      const id=objs.length;objs.push({t,cells:cs});cs.forEach(i=>{obj[i]=t;objId[i]=id});used.add(t);filled+=len;
    }
    if(!cells.some(i=>!obj[i]||OCC.has(obj[i])))return null;
  }
  return {N,K,reg,obj,objId,objs,rooms:rooms.map(x=>({name:x.name,color:x.color}))};
}

function geom(M){
  const N=M.N,occ=[];
  for(let i=0;i<N*N;i++)if(!M.obj[i]||OCC.has(M.obj[i]))occ.push(i);
  const nb=i=>{const y=Math.floor(i/N),x=i%N,o=[];for(const[dy,dx]of D4){const yy=y+dy,xx=x+dx;
    if(yy>=0&&yy<N&&xx>=0&&xx<N&&M.reg[yy*N+xx]===M.reg[i])o.push(yy*N+xx)}return o};
  const bord=(i,dy,dx)=>{const y=Math.floor(i/N)+dy,x=i%N+dx;return y<0||y>=N||x<0||x>=N||M.reg[y*N+x]!==M.reg[i]};
  const corner=i=>(bord(i,1,0)||bord(i,-1,0))&&(bord(i,0,1)||bord(i,0,-1));
  const edge=i=>{const y=Math.floor(i/N),x=i%N;return y===0||x===0||y===N-1||x===N-1};
  return {occ,nb,corner,edge};
}

function atomsFor(M,G){
  const A={};const types=new Set(M.obj.filter(Boolean));
  for(const t of types){if(OCC.has(t))A['op:'+t]=i=>M.obj[i]===t;
    A['naast:'+t]=i=>G.nb(i).some(q=>M.obj[q]===t)}
  for(let k=0;k<M.K;k++)A['in:'+k]=i=>M.reg[i]===k;
  A['hoek']=G.corner;A['rand']=G.edge;A['geenobject']=i=>!M.obj[i];A['alleen']=()=>true;
  return A;
}

function countSolutions(M,G,A,people,victim,clues,cap,budget){
  const N=M.N;const cand={};
  for(const n of people){
    if(n===victim){cand[n]=G.occ;continue}
    cand[n]=G.occ.filter(i=>clues[n].every(a=>A[a](i)));
    if(!cand[n].length)return {count:0};
  }
  const order=people.slice().sort((a,b)=>cand[a].length-cand[b].length);
  const alone=people.filter(n=>n!==victim&&clues[n].includes('alleen'));
  const pos={};let count=0,nodes=0,first=null,over=false;
  const regCnt=Array(M.K).fill(0);
  function rec(d,rows,cols){
    if(count>=cap||over)return;
    if(++nodes>budget){over=true;return}
    if(d===order.length){
      if(regCnt[M.reg[pos[victim]]]!==2)return;
      for(const n of alone)if(regCnt[M.reg[pos[n]]]!==1)return;
      count++;if(!first)first=Object.assign({},pos);return;
    }
    const n=order[d];
    for(const i of cand[n]){const y=Math.floor(i/N),x=i%N;
      if(rows>>y&1||cols>>x&1)continue;
      pos[n]=i;regCnt[M.reg[i]]++;rec(d+1,rows|1<<y,cols|1<<x);regCnt[M.reg[i]]--;
      if(count>=cap||over)return;}
  }
  rec(0,0,0);
  return {count:over?cap:count,first,over};
}

function placeSolution(r,M,G){
  const N=M.N;const occSet=new Set(G.occ);
  for(let t=0;t<60;t++){
    const colOf=Array(N);const usedC=new Set();
    const rows=[...Array(N).keys()];
    const go=y=>{if(y===N)return true;for(const x of shuffle(r,[...Array(N).keys()])){
      if(usedC.has(x)||!occSet.has(y*N+x))continue;usedC.add(x);colOf[y]=x;if(go(y+1))return true;usedC.delete(x)}return false};
    if(!go(0))return null;
    const cells=rows.map(y=>y*N+colOf[y]);
    const cnt={};cells.forEach(i=>cnt[M.reg[i]]=(cnt[M.reg[i]]||0)+1);
    const vIdx=shuffle(r,cells.map((_,j)=>j)).find(j=>cnt[M.reg[cells[j]]]===2);
    if(vIdx===undefined)continue;
    return {cells,vIdx};
  }
  return null;
}

function generate(seed,diff){
  const cfg=DIFF[diff];
  for(let att=0;att<400;att++){
    const r=rng(seed*7919+att*104729+13);
    const M=buildMap(r,cfg);if(!M)continue;
    const G=geom(M);const A=atomsFor(M,G);
    const P=placeSolution(r,M,G);if(!P)continue;
    const N=M.N;const letters='ABCDEFGH'.slice(0,N-1).split('');
    const fpool=shuffle(r,FACES.f),mpool=shuffle(r,FACES.m);
    const sus=letters.map(L=>{const [nm,g]=pick(r,NAMES[L]);return {name:nm,g,face:(g==='f'?fpool:mpool).pop()}});
    const [vn,vg]=pick(r,VICTIMS);const vic={name:vn,g:vg,face:vg==='f'?'👸':'🤴',victim:true};
    const others=shuffle(r,P.cells.filter((_,j)=>j!==P.vIdx));
    const sol={};sus.forEach((s,j)=>sol[s.name]=others[j]);sol[vic.name]=P.cells[P.vIdx];
    const people=sus.map(s=>s.name).concat(vic.name);
    const regCnt={};Object.values(sol).forEach(i=>regCnt[M.reg[i]]=(regCnt[M.reg[i]]||0)+1);
    const truth={},strength={};
    for(const a in A)strength[a]=a==='alleen'?G.occ.length*0.6:G.occ.filter(A[a]).length;
    for(const s of sus){const i=sol[s.name];
      truth[s.name]=Object.keys(A).filter(a=>a==='alleen'?regCnt[M.reg[i]]===1:A[a](i)).filter(a=>strength[a]<G.occ.length)}
    const res=chooseClues(r,cfg.mode,M,G,A,people,vic.name,sus,truth,strength);
    if(!res)continue;
    const killer=people.find(n=>n!==vic.name&&M.reg[sol[n]]===M.reg[sol[vic.name]]);
    return {seed,diff,M,sus,vic,sol,clues:res,killer};
  }
  return null;
}

function chooseClues(r,mode,M,G,A,people,victim,sus,truth,strength){
  const names=sus.map(s=>s.name);const BUD=40000;
  const cnt=(cl,cap)=>countSolutions(M,G,A,people,victim,cl,cap,BUD).count;
  const clues={};
  for(const n of names){
    const t=truth[n].slice().sort((a,b)=>strength[a]-strength[b]);
    if(!t.length)return null;
    let pool=mode==='easy'?t.slice(0,Math.max(1,Math.ceil(t.length/3))):t.slice(0,Math.max(1,Math.ceil(t.length*2/3)));
    clues[n]=[pick(r,pool)];
  }
  let c=cnt(clues,60);
  for(let it=0;it<40&&c!==1;it++){
    let best=null;
    for(const n of shuffle(r,names)){
      const opts=truth[n].map(a=>[a]);
      if(clues[n].length===1)truth[n].forEach(a=>{if(a!==clues[n][0])opts.push([clues[n][0],a])});
      for(const o of opts){
        if(o.length===clues[n].length&&o.every((a,j)=>a===clues[n][j]))continue;
        const t=Object.assign({},clues);t[n]=o;const k=cnt(t,c);
        if(k<1||k>=c)continue;
        const weak=o.reduce((s,a)=>s+Math.log(strength[a]+1),0)-(o.length-1)*1.5;
        let score;
        if(mode==='easy')score=[k,-weak*0.01,r()];
                else score=[k,o.length,r()];
        if(!best||cmp(score,best.score)<0)best={score,n,o,k};
      }
    }
    if(!best)return null;
    clues[best.n]=best.o;c=best.k;
  }
  if(c!==1)return null;
  const rounds=mode==='hard'?3:mode==='medium'?1:0;
  for(let rd=0;rd<rounds;rd++){ // loosen clues while the answer stays unique
    for(const n of shuffle(r,names)){
      const alts=truth[n].map(a=>[a]).filter(o=>!(o.length===clues[n].length&&o[0]===clues[n][0]))
        .sort((a,b)=>strength[b[0]]-strength[a[0]]);
      const curW=clues[n].length>1?-1:strength[clues[n][0]];
      for(const o of alts){if(clues[n].length===1&&strength[o[0]]<=curW)break;
        const t=Object.assign({},clues);t[n]=o;if(cnt(t,2)===1){clues[n]=o;break}}
    }
  }
  const fin=countSolutions(M,G,A,people,victim,clues,2,3000000);
  if(fin.over||fin.count!==1)return null;
  return clues;
}
function cmp(a,b){for(let i=0;i<a.length;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1}return 0}
</script>

// ---------- board ----------

    const t=new THREE.Mesh(new THREE.BoxGeometry(.985,.1,.985),new THREE.MeshStandardMaterial({color:col,map:tileTex,roughness:.85}));
    t.position.set(p.x,-.05,p.z);t.receiveShadow=true;t.userData.i=i;world.add(t);tiles.push(t)}
  // region walls
  const wm=new THREE.MeshStandardMaterial({map:stoneTex,color:'#efe4cc',roughness:.9});const posts=new Set();
  const post=(x,z)=>{const k=x+','+z;if(posts.has(k))return;posts.add(k);world.add(box(.11,.3,.11,wm,x,.15,z))};
  for(let i=0;i<N*N;i++){const y=Math.floor(i/N),x=i%N,p=cellPos(i);
    if(x+1<N&&M.reg[i+1]!==M.reg[i]){world.add(box(.07,.24,1,wm,p.x+.5,.12,p.z));post(p.x+.5,p.z-.5);post(p.x+.5,p.z+.5)}
    if(y+1<N&&M.reg[i+N]!==M.reg[i]){world.add(box(1,.24,.07,wm,p.x,.12,p.z+.5));post(p.x-.5,p.z+.5);post(p.x+.5,p.z+.5)}}

    for(let k=-H+.25;k<H;k+=.5){world.add(box(.18,.16,.3,cw,k,wh,s*E));world.add(box(.3,.16,.18,cw,s*E,wh,k))}}
  const roofM=mat('#5a2236',{flatShading:true});
  for(const a of[-1,1])for(const b of[-1,1]){const x=a*(E+.1),z=b*(E+.1);world.add(cyl(.55,.62,1.5,cw,x,.55,z,16));
    for(let k=0;k<8;k++){const an=k/8*Math.PI*2;world.add(box(.16,.18,.16,cw,x+Math.cos(an)*.5,1.38,z+Math.sin(an)*.5))}
    const r=sh(new THREE.Mesh(new THREE.ConeGeometry(.5,.9,16),roofM));r.position.set(x,1.85,z);world.add(r);
    const fl=box(.02,.3,.02,mat('#333'),x,2.4,z);world.add(fl);const flag=box(.22,.13,.01,mat('#c0392b'),x+.12,2.48,z);world.add(flag);flames.push({flag,ph:Math.random()*6});
    world.add(flame(x+a*-.45,1.1,z+b*-.45,3));
    const L=new THREE.PointLight('#ff9a4a',2.2,7,1.6);L.position.set(x-a*.9,1.3,z-b*.9);world.add(L);flames.push({light:L,ph:Math.random()*9})}

  // objects
  for(const [oi,ob] of M.objs.entries()){const f=BUILD[ob.t];if(!f)continue;
    const ys=ob.cells.map(i=>Math.floor(i/N)),xs=ob.cells.map(i=>i%N);const L=ob.cells.length;
    const cx=(Math.min(...xs)+Math.max(...xs))/2-(N-1)/2,cz=(Math.min(...ys)+Math.max(...ys))/2-(N-1)/2;

   notesTex=new THREE.CanvasTexture(c);notesTex.colorSpace=THREE.SRGBColorSpace;notesTex.anisotropy=8;
   notesMesh=new THREE.Mesh(new THREE.PlaneGeometry(N,N),new THREE.MeshBasicMaterial({map:notesTex,transparent:true,depthWrite:false}));
   notesMesh.rotation.x=-Math.PI/2;notesMesh.position.y=.035;notesMesh.renderOrder=5;world.add(notesMesh)}
  // region labels

    const l=labelPlane(M.rooms[k].name.toUpperCase());const p=cellPos(best);l.position.set(p.x,.03,p.z+.32);l.scale.setScalar(.85);world.add(l)}
  // highlight ring
  hl=new THREE.Mesh(new THREE.RingGeometry(.36,.46,32),new THREE.MeshBasicMaterial({color:'#ffd977',transparent:true,opacity:.0,depthWrite:false}));hl.rotation.x=-Math.PI/2;hl.position.y=.04;world.add(hl);
  spot=new THREE.SpotLight('#ff3b2b',0,8,.32,.5,1);spot.position.set(0,5,0);world.add(spot);world.add(spot.target);
  const dust=new THREE.BufferGeometry();const dp=[];for(let i=0;i<220;i++)dp.push((Math.random()-.5)*(N+2),Math.random()*3,(Math.random()-.5)*(N+2));
  dust.setAttribute('position',new THREE.Float32BufferAttribute(dp,3));
  const dpts=new THREE.Points(dust,new THREE.PointsMaterial({color:'#ffe3a8',size:.04,transparent:true,opacity:.6,depthWrite:false}));dpts.userData.dust=true;world.add(dpts);
  sun.shadow.camera.left=sun.shadow.camera.bottom=-(H+2.5);sun.shadow.camera.right=sun.shadow.camera.top=H+2.5;sun.shadow.camera.updateProjectionMatrix();
}

// ---------- notes ----------
const SLOT=L=>L==='V'?8:'ABCDEFGH'.indexOf(L);
const byLetter=L=>people().find(n=>letter(n)===L);
const ncolor=n=>n===P.vic.name?'#c62828':pcolor(n);
function drawNotes(){if(!notesCtx)return;const N=P.M.N,g=notesCtx;g.clearRect(0,0,N*NPX,N*NPX);
  const focus=tool&&tool!=='X'&&tool!=='erase'?letter(tool):null;const sl=NPX/3;
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  for(const k in notes){const i=+k,x0=(i%N)*NPX,y0=Math.floor(i/N)*NPX;
    for(const L of notes[k]){const n=byLetter(L);if(!n)continue;const s=SLOT(L),cx=x0+sl*(s%3)+sl/2,cy=y0+sl*Math.floor(s/3)+sl/2;
      const on=!focus||focus===L;g.globalAlpha=on?1:.55;
      if(focus===L){g.fillStyle=ncolor(n);g.beginPath();g.arc(cx,cy,sl*.46,0,7);g.fill();g.fillStyle='#fff';g.font=`800 ${sl*.7}px Cinzel, Georgia, serif`;g.fillText(L,cx,cy+2)}
      else{g.font=`800 ${sl*.68}px Cinzel, Georgia, serif`;g.lineWidth=7;g.strokeStyle='rgba(255,250,235,.95)';g.strokeText(L,cx,cy+2);g.fillStyle=ncolor(n);g.fillText(L,cx,cy+2)}}}
  g.globalAlpha=1;notesTex.needsUpdate=true;notesMesh.visible=!showSol}
const FADE=new Map();
function faded(m){if(!FADE.has(m)){const c=m.clone();c.transparent=true;c.opacity=.22;c.depthWrite=false;FADE.set(m,c)}return FADE.get(m)}
function fadeFurniture(on){for(const g of furn)g.traverse(o=>{
  if(o.isSprite){o.visible=!on;return}if(!o.isMesh)return;
  if(on&&!o.userData.orig){o.userData.orig=o.material;o.material=Array.isArray(o.material)?o.material.map(faded):faded(o.material);o.castShadow=false}
  else if(!on&&o.userData.orig){o.material=o.userData.orig;o.userData.orig=null;o.castShadow=true}})}
function setMode(m){mode=m;document.querySelectorAll('.seg.mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
  $('#hud').classList.toggle('notes',m==='notes');
  // in note mode the letters must stay readable: draw them over the furniture and fade the furniture
  if(notesMesh){notesMesh.material.depthTest=m!=='notes';notesMesh.material.needsUpdate=true}fadeFurniture(m==='notes');
  if(m==='notes'&&!topView){topView=true;$('#camBtn').textContent='3D';flyTo(true,700)}
  renderUI()}
document.querySelectorAll('.seg.mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function snap(){hist.push(JSON.stringify({state,marks,notes}));if(hist.length>300)hist.shift()}
function undo(){if(showSol)return;if(!hist.length){toast('Niets om ongedaan te maken.');return}
  const s=JSON.parse(hist.pop());state=s.state;marks=s.marks;notes=s.notes;syncPawns();renderUI();save()}
$('#undoBtn').onclick=undo;
// placing someone settles their row and column: clear those notes and that person's notes elsewhere
function placeAt(n,i){const N=P.M.N,L=letter(n);state[n]=i;delete marks[i];
  for(const k in notes){const j=+k;if(Math.floor(j/N)===Math.floor(i/N)||j%N===i%N)delete notes[k];else{const s=notes[k].replace(L,'');if(s)notes[k]=s;else delete notes[k]}}}

// ---------- pawns ----------
const PAWN_GEO=new THREE.LatheGeometry([[0,0],[.2,0],[.21,.03],[.18,.06],[.12,.09],[.085,.14],[.07,.3],[.12,.33],[.12,.35],[.06,.37],[0,.37]].map(p=>new THREE.Vector2(p[0],p[1])),24);
function badgeTex(n){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle=pcolor(n);g.beginPath();g.arc(64,64,58,0,7);g.fill();g.lineWidth=6;g.strokeStyle=n===P.vic.name?'#b22222':'#fff3cf';g.stroke();
  g.font='64px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(person(n).face,64,58);
  g.fillStyle='rgba(0,0,0,.65)';g.beginPath();g.arc(100,100,22,0,7);g.fill();g.fillStyle='#fff';g.font='800 28px Cinzel, Georgia, serif';g.fillText(letter(n),100,102);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function makePawn(n){const g=new THREE.Group();const isV=n===P.vic.name;
  const m=new THREE.MeshStandardMaterial({color:pcolor(n),metalness:.35,roughness:.35,emissive:'#000'});
  const body=sh(new THREE.Mesh(PAWN_GEO,m));g.add(body);const head=sh(new THREE.Mesh(new THREE.SphereGeometry(.11,20,16),m));head.position.y=.46;g.add(head);
  if(isV){const cr=sh(new THREE.Mesh(new THREE.CylinderGeometry(.08,.06,.06,8,1,true),mat('#d9a93a',GOLD)));cr.position.y=.57;g.add(cr)}
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:badgeTex(n),depthTest:false,transparent:true}));sp.scale.setScalar(.6);sp.position.y=.95;sp.renderOrder=10;g.add(sp);
  g.userData={n,m,body,sp};world.add(g);return g}
function baseY(i){const t=P.M.obj[i];return t?HEIGHT[t]||0:0}

const tweens=[];
function tween(dur,fn,done){tweens.push({t0:performance.now(),dur,fn,done})}
const ease=t=>1-Math.pow(1-t,3);
const bounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};

function syncPawns(animate=true){
  const pos=showSol?P.sol:state;const N=P.M.N;
  const rows={},cols={};for(const n in pos){const i=pos[n];(rows[Math.floor(i/N)]=rows[Math.floor(i/N)]||[]).push(n);(cols[i%N]=cols[i%N]||[]).push(n)}
  for(const n of people()){
    const i=pos[n];let pw=pawns[n];
    if(i===undefined){if(pw){const p0=pw;delete pawns[n];tween(220,t=>{p0.scale.setScalar(1-t)},()=>world.remove(p0))}continue}
    if(!pw){pw=pawns[n]=makePawn(n);pw.userData.cell=-1}
    const target=cellPos(i);target.y=baseY(i);
    const lying=showSol&&n===P.vic.name;
    if(pw.userData.cell!==i||pw.userData.lying!==lying){
      const from=pw.userData.cell<0?target.clone().setY(target.y+2.2):pw.position.clone();
      pw.userData.cell=i;pw.userData.lying=lying;
      if(animate){const fromRot=pw.rotation.z;pw.scale.setScalar(1);
        tween(pw.userData.cell<0?650:520,t=>{const k=bounce(t);pw.position.lerpVectors(from,target,k);if(from.y<target.y+1)pw.position.y+=Math.sin(Math.PI*t)*.5;
          pw.rotation.z=fromRot+((lying?Math.PI/2:0)-fromRot)*ease(t)})}
      else{pw.position.copy(target);pw.rotation.z=lying?Math.PI/2:0}
    }
    const bad=!showSol&&(rows[Math.floor(i/N)].length>1||cols[i%N].length>1);pw.userData.bad=bad;
  }
  for(const k in xMarks)if(showSol||!marks[k]){world.remove(xMarks[k]);delete xMarks[k]}
  if(!showSol)for(const k in marks)if(!xMarks[k]){const g=new THREE.Group(),m=mat('#c0392b',{emissive:'#3a0a05'});
    const a=box(.62,.05,.09,m),b=box(.62,.05,.09,m);a.rotation.y=Math.PI/4;b.rotation.y=-Math.PI/4;g.add(a,b);
    const p=cellPos(+k);g.position.set(p.x,.03,p.z);world.add(g);xMarks[k]=g;g.scale.setScalar(.01);tween(200,t=>g.scale.setScalar(ease(t)))}
  if(showSol){const kp=cellPos(P.sol[P.killer]);spot.position.set(kp.x,4.5,kp.z+.4);spot.target.position.copy(kp);tween(900,t=>spot.intensity=t*40)}
  else spot.intensity=0;
}

// ---------- camera ----------
let topView=false;
let freeFrac={w:1,h:1};
function camGoal(top){const N=P.M.N;const R=N/2+(top?.9:1.4);const tf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const d=Math.max(R/(tf*freeFrac.h),R/(tf*camera.aspect*freeFrac.w))*(top?1:1.08);
  const dir=top?new THREE.Vector3(0,1,.001):new THREE.Vector3(0,.8,.6).normalize();
  return {pos:dir.multiplyScalar(d),tgt:new THREE.Vector3(0,top?0:-.2,0)}}
function flyTo(top,dur=1100,fromFar=false){const g=camGoal(top);const p0=fromFar?new THREE.Vector3(-g.pos.z*1.6,g.pos.y*2.2,g.pos.z*1.8):camera.position.clone();const t0=controls.target.clone();
  controls.enabled=false;tween(dur,t=>{const k=ease(t);camera.position.lerpVectors(p0,g.pos,k);controls.target.lerpVectors(t0,g.tgt,k)},()=>controls.enabled=true)}
$('#camBtn').onclick=()=>{topView=!topView;$('#camBtn').textContent=topView?'3D':'Boven';flyTo(topView,800)};

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  // keep the board centred in the free area between the panels
  const hud=$('#hud').getBoundingClientRect(),head=$('header').getBoundingClientRect();
  const left=innerWidth>=900?$('#dossier').getBoundingClientRect().right:0;
  const top=head.bottom,bottom=hud.top;const fw=w-left,fh=bottom-top;
  camera.setViewOffset(w,h,-(left/2),-((top-(h-bottom))/2),w,h);camera.fov=40;freeFrac={w:fw/w,h:fh/h};camera.updateProjectionMatrix();
  controls.maxDistance=60;controls.minDistance=3}
addEventListener('resize',()=>{resize();if(P)flyTo(topView,300)});

// ---------- loop ----------
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const now=performance.now(),t=clock.getElapsedTime();
  for(let k=tweens.length-1;k>=0;k--){const tw=tweens[k];const p=Math.min(1,(now-tw.t0)/tw.dur);tw.fn(p);if(p>=1){tweens.splice(k,1);tw.done&&tw.done()}}
  for(const f of flames){if(f.g){const s=1+Math.sin(t*12+f.ph)*.08+Math.sin(t*23+f.ph)*.05;f.g.scale.set(s,s*(1+Math.sin(t*9+f.ph)*.1),s)}
    if(f.light)f.light.intensity=2+Math.sin(t*10+f.ph)*.35+Math.sin(t*27+f.ph)*.2;if(f.flag)f.flag.rotation.y=Math.sin(t*3+f.ph)*.35}
  if(world)world.children.forEach(o=>{if(o.userData.dust){o.rotation.y=t*.02;o.position.y=Math.sin(t*.3)*.1}});
  if(hl)hl.material.opacity=hl.userData.on?(.55+Math.sin(t*5)*.3):0;
  for(const n in pawns){const pw=pawns[n];const m=pw.userData.m;
    m.emissive.set(pw.userData.bad?'#ff1a00':(showSol&&n===P.killer)?'#5a0000':'#000');m.emissiveIntensity=pw.userData.bad?(.5+Math.sin(t*8)*.4):1;
    const sel=tool===n;pw.userData.sp.scale.setScalar(sel?.72+Math.sin(t*6)*.04:.6)}
  controls.update();renderer.render(scene,camera)}

// ---------- input ----------
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()}});
canvas.addEventListener('pointerup',e=>{if(!down||!P)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);const dt=performance.now()-down.t;down=null;
  if(d>8||dt>600)return;const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr,camera);
  const pawnHits=ray.intersectObjects(Object.values(pawns).map(p=>p.userData.body),false);
  let i=null;if(pawnHits.length){const pw=pawnHits[0].object.parent;i=pw.userData.cell}
  else{const h=ray.intersectObjects(tiles,false);if(h.length)i=h[0].object.userData.i;else{
    // tap on furniture: project to floor
    const pl=new THREE.Plane(new THREE.Vector3(0,1,0),-.2);const v=new THREE.Vector3();if(ray.ray.intersectPlane(pl,v)){const N=P.M.N;const x=Math.round(v.x+(N-1)/2),z=Math.round(v.z+(N-1)/2);if(x>=0&&x<N&&z>=0&&z<N)i=z*N+x}}}
  if(i===null)return;
  // furniture can hide the tile: prefer floor-plane projection when it hits an object above the floor
  const all=ray.intersectObjects(world.children,true).find(h=>!h.object.isSprite&&h.object!==hl&&!h.object.userData.dust);
  if(all&&!pawnHits.length&&tiles.indexOf(all.object)<0){const N=P.M.N,v=all.point;const x=Math.round(v.x+(N-1)/2),z=Math.round(v.z+(N-1)/2);if(x>=0&&x<N&&z>=0&&z<N)i=z*N+x}
  tapCell(i)});

function tapCell(i){
  if(showSol)return;const p=cellPos(i);hl.position.set(p.x,.04,p.z);hl.userData.on=true;clearTimeout(hl.userData.to);hl.userData.to=setTimeout(()=>hl.userData.on=false,900);
  const occAt=Object.keys(state).find(n=>state[n]===i);const canStand=geom(P.M).occ.includes(i);
  if(mode==='notes'&&tool!=='X'){
    if(!tool){toast('Kies eerst een verdachte voor je notitie.');buzz();return}
    if(tool==='erase'){if(!notes[i])return;snap();delete notes[i]}
    else{if(occAt){toast(`Hier staat al ${occAt}.`);return}
      if(!canStand){toast('Daar kan niemand staan.','bad');buzz();return}
      snap();const L=letter(tool);const s=notes[i]||'';const t=s.includes(L)?s.replace(L,''):s+L;if(t)notes[i]=t;else delete notes[i];delete marks[i]}
    renderUI();save();return}
  if(!tool){if(occAt){tool=occAt;renderUI();return}snap();if(marks[i])delete marks[i];else{marks[i]=1;delete notes[i]}}
  else if(tool==='X'){snap();if(marks[i])delete marks[i];else{marks[i]=1;delete notes[i];if(occAt)delete state[occAt]}}
  else if(tool==='erase'){snap();delete marks[i];delete notes[i];if(occAt)delete state[occAt]}
  else{if(!canStand){toast('Daar kan niemand staan.','bad');buzz();return}
    snap();if(occAt===tool)delete state[tool];else{if(occAt)delete state[occAt];placeAt(tool,i);
      const nxt=people().find(n=>state[n]===undefined);if(nxt&&innerWidth<900)tool=nxt}}
  syncPawns();renderUI();save()}
function buzz(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}

// ---------- UI ----------
let toastT;function toast(t,c=''){const m=$('#toast');m.textContent=t;m.className='glass on '+c;clearTimeout(toastT);toastT=setTimeout(()=>m.classList.remove('on'),3200)}
function chip(id,html,label,cls=''){const b=document.createElement('button');b.className='chip '+cls;b.innerHTML=html;b.setAttribute('aria-label',label);b.setAttribute('aria-pressed',tool===id);
  if(state[id]!==undefined)b.classList.add('done');b.onclick=()=>{tool=tool===id?null:id;renderUI()};return b}
function renderUI(){
  const pal=$('#palette');pal.innerHTML='';
  for(const n of people())pal.appendChild(chip(n,`<span class="dot" style="background:${pcolor(n)}">${person(n).face}</span>${letter(n)}`,n));
  pal.appendChild(chip('X','✕','Vak schrappen','tool'));pal.appendChild(chip('erase','⌫','Gum','tool'));
  const cb=$('#cluebar');
  const tag=mode==='notes'?'<span class="mode-tag">✎ NOTITIE</span>':'';
  if(tool&&tool!=='X'&&tool!=='erase'){cb.innerHTML=`<span class="face">${person(tool).face}</span><div><div class="nm">${tag}${tool.toUpperCase()}</div><div class="tx">${clueText(tool)}</div></div>`}
  else if(tool==='X')cb.innerHTML=`<div class="tx">${tag}Tik op vakken om ze te <b>schrappen</b>.</div>`;
  else if(tool==='erase')cb.innerHTML=`<div class="tx">${tag}Tik op een vak om ${mode==='notes'?'de notities':'het'} te <b>wissen</b>.</div>`;
  else if(mode==='notes')cb.innerHTML=`<div class="tx">${tag}Kies een verdachte en tik op elk vak waar die <b>misschien</b> stond.</div>`;
  else cb.innerHTML=`<div class="tx">Kies een verdachte en tik op een vak. Met <b>✎ Notitie</b> zet je kleine letters voor twijfelgevallen.</div>`;
  drawNotes();
  const c=$('#cards');c.innerHTML='';
  for(const n of people()){const s=person(n);const d=document.createElement('div');d.className='card'+(s.victim?' victim':'')+(tool===n?' sel':'');
    d.innerHTML=`${state[n]!==undefined?'<span class="ok">✓</span>':''}<div class="face">${s.face}</div><div class="nm">${n.toUpperCase()}</div><div>${clueText(n)}</div>`;
    d.onclick=()=>{tool=n;renderUI();$('#dossier').classList.remove('open')};c.appendChild(d)}
  requestAnimationFrame(resize);
}
function renderStatic(){
  $('#caseNo').textContent=`zaak ${P.seed}`;
  const vn=P.vic.name.replace(/^(\w)/,c=>c.toUpperCase());
  $('#title').textContent=`Zaak ${P.seed}: moord op ${vn}`;$('#sub').textContent=SUBS[P.seed%SUBS.length];
  const types=[...new Set(P.M.obj.filter(Boolean))];
  $('#legend').innerHTML=`<div class="y"><h4>KUNNEN WORDEN BEZET</h4>${types.filter(t=>OCC.has(t)).map(t=>LABEL[t]).join(', ')}</div><div class="n"><h4>KUNNEN NIET WORDEN BEZET</h4>${types.filter(t=>!OCC.has(t)).map(t=>LABEL[t]).join(', ')}</div>`;
  $('#rules').innerHTML=`<li>Iedere persoon staat in een eigen <b>rij</b> en een eigen <b>kolom</b>.</li>
<li>Je staat op een lege tegel of op een object dat bezet kan worden: stoel, bank, bed, tapijt, troon of paard.</li>
<li><b>Naast</b> betekent direct ervoor, erachter, links of rechts, <b>in hetzelfde gebied</b>. Muren scheiden de gebieden.</li>
<li>Een <b>hoek van een gebied</b> is een vak waar twee muren van dat gebied samenkomen. De buitenmuur telt mee.</li>
<li><b>Alleen</b> betekent: niemand anders in hetzelfde gebied.</li>
<li>Het slachtoffer was alleen met de moordenaar.</li>`;
  $('#printLink').href=`../#${P.diff}-${P.seed}`;
  $('#susList').innerHTML=P.sus.map(s=>`<button data-n="${s.name}"><span>${s.face}</span>${s.name}</button>`).join('');
  document.querySelectorAll('#susList button').forEach(b=>b.onclick=()=>accuse(b.dataset.n));
}

$('#dossBtn').onclick=()=>$('#dossier').classList.add('open');
$('#closeDoss').onclick=()=>$('#dossier').classList.remove('open');
$('#moreBtn').onclick=e=>{e.stopPropagation();const m=$('#more');m.classList.toggle('on');$('#moreBtn').setAttribute('aria-expanded',m.classList.contains('on'))};
document.addEventListener('click',e=>{if(!e.target.closest('#more')&&e.target.id!=='moreBtn')$('#more').classList.remove('on')});
$('#more').addEventListener('click',e=>{if(e.target.closest('button'))setTimeout(()=>$('#more').classList.remove('on'),0)});
$('#hintBtn').onclick=()=>{if(showSol)return;const wrong=people().find(n=>state[n]!==undefined&&state[n]!==P.sol[n]);
  if(wrong){toast(`${wrong} staat niet goed.`,'bad');tool=wrong;renderUI();return}
  const todo=people().find(n=>state[n]===undefined);if(!todo){toast('Alles staat. Wie is de moordenaar?');return}
  snap();placeAt(todo,P.sol[todo]);toast(`${todo} is geplaatst.`);syncPawns();renderUI();save()};
$('#clearNotesBtn').onclick=()=>{if(!Object.keys(notes).length)return;snap();notes={};renderUI();save();toast('Notities gewist. ↶ zet ze terug.')};
$('#clearBtn').onclick=()=>{if(!confirm('Pionnen, kruisjes en notities wissen?'))return;snap();state={};marks={};notes={};if(showSol)toggleSol();syncPawns();renderUI();save()};
function toggleSol(){showSol=!showSol;$('#solveBtn').textContent=showSol?'Verberg oplossing':'Oplossing';syncPawns();drawNotes();
  if(showSol)toast(`${P.killer} was alleen met ${P.vic.name} in de ${P.M.rooms[P.M.reg[P.sol[P.vic.name]]].name.toLowerCase()}.`)}
$('#solveBtn').onclick=toggleSol;
$('#accuseBtn').onclick=()=>$('#accuse').classList.add('on');
$('#accuseCancel').onclick=()=>$('#accuse').classList.remove('on');
function accuse(n){$('#accuse').classList.remove('on');
  const wrong=people().filter(k=>state[k]!==undefined&&state[k]!==P.sol[k]).length;const placed=people().filter(k=>state[k]!==undefined).length;
  if(n!==P.killer){toast(`${n} heeft een alibi. Kijk nog eens naar het bord.`,'bad');buzz();return}
  if(placed<people().length||wrong){toast(`Goed gegokt, maar het bord is nog niet compleet. Bewijs het!`,'');return}
  toast(`Opgelost! ${P.killer} is de moordenaar. 🎉`,'good');confetti();try{localStorage.setItem('murdoku2:solved:'+P.diff+':'+P.seed,'1')}catch(e){}}
function confetti(){const cols=['#e8c272','#e0503c','#3d8bfd','#2fbf71','#ffffff'];const g=new THREE.Group();world.add(g);const parts=[];
  for(let i=0;i<160;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(.08,.14),new THREE.MeshBasicMaterial({color:cols[i%5],side:THREE.DoubleSide}));
    m.position.set((Math.random()-.5)*P.M.N,4+Math.random()*3,(Math.random()-.5)*P.M.N);m.userData.v=new THREE.Vector3((Math.random()-.5)*.02,-.02-Math.random()*.03,(Math.random()-.5)*.02);
    m.userData.r=new THREE.Vector3(Math.random()*.2,Math.random()*.2,Math.random()*.2);g.add(m);parts.push(m)}
  tween(5000,()=>{for(const m of parts){m.position.add(m.userData.v);m.rotation.x+=m.userData.r.x;m.rotation.y+=m.userData.r.y;m.position.x+=Math.sin(m.position.y*3)*.004}},()=>world.remove(g))}

document.querySelectorAll('header .seg button').forEach(b=>b.onclick=()=>{diff=b.dataset.d;newCase()});
$('#newBtn').onclick=()=>newCase();

function save(){try{localStorage.setItem('murdoku2:'+P.diff+':'+P.seed,JSON.stringify({state,marks,notes}));localStorage.setItem('murdoku2:last',location.hash)}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('murdoku2:'+P.diff+':'+P.seed)||'null');if(s){state=s.state||{};marks=s.marks||{};notes=s.notes||{}}}catch(e){}}

let worker=null;
function makeWorker(){try{const src=document.getElementById('core').textContent+`;onmessage=e=>postMessage(generate(e.data.seed,e.data.diff))`;
  return new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})))}catch(e){return null}}
function genAsync(seed,d){return new Promise(res=>{if(worker===null)worker=makeWorker()||false;
  if(!worker){setTimeout(()=>res(generate(seed,d)),30);return}let done=false;
  worker.onmessage=e=>{done=true;res(e.data)};worker.onerror=()=>{if(done)return;done=true;worker=false;res(generate(seed,d))};worker.postMessage({seed,diff:d})})}
async function openCase(seed,d){
  $('#loader').classList.remove('off');$('#loadTxt').textContent='Een nieuwe moord wordt beraamd…';
  let g=null;for(let k=0;k<5&&!g;k++){g=await genAsync(seed,d);if(!g)seed++}
  if(!g){$('#loader').classList.add('off');toast('Dat lukte niet. Probeer opnieuw.','bad');return}
  P=g;diff=d;state={};marks={};notes={};hist.length=0;showSol=false;tool=null;$('#solveBtn').textContent='Oplossing';
  document.querySelectorAll('header .seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.d===d));
  history.replaceState(null,'',`#${d}-${seed}`);load();
  buildWorld();renderStatic();setMode('pen');syncPawns(false);resize();save();
  $('#loader').classList.add('off');topView=false;$('#camBtn').textContent='Boven';flyTo(false,1800,true);
}
function newCase(){openCase(1+Math.floor(Math.random()*99999),diff)}
function fromHash(){const m=/^#(easy|medium|hard)-(\d+)$/.exec(location.hash);if(m){openCase(+m[2],m[1]);return true}return false}
addEventListener('hashchange',()=>{if(!P||location.hash!==`#${P.diff}-${P.seed}`)fromHash()});
camera.position.set(0,20,20);resize();loop();
document.fonts&&document.fonts.ready.then(()=>{});
if(!fromHash()){let last=null;try{last=localStorage.getItem('murdoku2:last')}catch(e){}
  if(last&&/^#(easy|medium|hard)-\d+$/.test(last))location.hash=last,fromHash();else openCase(75,'medium')}
addEventListener('keydown',e=>{if(!P||e.target.closest('select,input,textarea'))return;const k=e.key.toUpperCase();
  if((e.metaKey||e.ctrlKey)&&k==='Z'){e.preventDefault();undo();return}if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(k==='Z')undo();else if(k==='N')setMode(mode==='notes'?'pen':'notes');else if(k==='X')tool=tool==='X'?null:'X';
  else if(k==='BACKSPACE'||k==='DELETE')tool=tool==='erase'?null:'erase';else if(k==='ESCAPE')tool=null;
  else{const n=byLetter(k);if(!n)return;tool=tool===n?null:n}renderUI()});
window.__dbg={get P(){return P},tapCell,setMode,get notes(){return notes},get state(){return state},get pawns(){return pawns},camera};
</script>
