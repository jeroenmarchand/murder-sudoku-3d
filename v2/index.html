<style>

</style>

<body>
<canvas id="c"></canvas>
<header class="glass">
  <h1>Moord in de burcht <small><span id="caseNo"></span> · <span id="timer" aria-label="Speeltijd"></span></small></h1>
  <div class="row">
    <button class="btn gold" id="newBtn" aria-expanded="false">Nieuwe zaak</button>
  </div>
  <div id="newMenu" class="glass pop">
    <div class="pop-h">Kies een moeilijkheid</div>
    <button class="btn diff" data-d="easy"><b>Makkelijk</b><small>6×6 · ruime aanwijzingen</small></button>
    <button class="btn diff" data-d="medium"><b>Normaal</b><small>8×8 · een flinke puzzel</small></button>
    <button class="btn diff" data-d="hard"><b>Moeilijk</b><small>9×9 · elke aanwijzing telt</small></button>
  </div>
</header>
<div id="fab">
  <button class="btn round" id="camBtn" aria-label="Wissel camera" title="Wissel camera (C)">Boven</button>
  <button class="btn round" id="dossBtn" aria-label="Dossier openen">Dossier</button>
</div>

<aside id="dossier" class="glass">
  <button class="btn close" id="closeDoss">Sluiten</button>
  <h2 id="title"></h2><p class="sub" id="sub"></p>
  <div class="cards" id="cards"></div>
  <div class="rules"><h3>Spelregels</h3><ul id="rules"></ul></div>
  <div class="legend" id="legend"></div>
  <p style="text-align:center;margin-top:12px"><a id="printLink" class="btn" style="text-decoration:none;display:inline-block" href="../">Afdrukken (klassieke versie)</a></p>
</aside>

<div id="hud" class="glass">
  <div id="cluebar"></div>
  <div id="palette"></div>
  <div id="actions">
    <div class="seg mode" role="group" aria-label="Invoer">
      <button data-m="pen" aria-pressed="true" title="Pion plaatsen (N wisselt)" aria-label="Pion"><i>♟</i><span> Pion</span></button><button data-m="notes" title="Notities maken (N wisselt)" aria-label="Notitie"><i>✎</i><span> Notitie</span></button><button data-m="x" title="Vakken schrappen (X)" aria-label="Kruis"><i>✕</i><span> Kruis</span></button>
    </div>
    <button class="btn icon" id="undoBtn" aria-label="Ongedaan maken" title="Ongedaan maken (Z)">↶</button>
    <button class="btn icon" id="hintBtn" aria-label="Hint" title="Hint (H)">💡</button>
    <button class="btn icon" id="moreBtn" aria-label="Meer" aria-expanded="false">⋯</button>
    <button class="btn gold" id="accuseBtn">Beschuldig</button>
  </div>
  <div id="more" class="glass pop">
    <button class="btn" id="solveBtn">Oplossing</button>
    <button class="btn" id="clearNotesBtn">Wis notities</button>
    <button class="btn" id="clearBtn">Wis alles</button>
  </div>
</div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
<div class="modal" id="accuse"><div class="glass"><h3>Wie is de moordenaar?</h3><p class="msub" id="accuseSub"></p><div class="sus" id="susList"></div><button class="btn" id="accuseCancel">Annuleren</button></div></div>
<div class="modal" id="win"><div class="glass">
  <div class="seal">⚖️</div><h3>Zaak gesloten</h3>
  <p class="msub" id="winTxt"></p>
  <div class="stats" id="winStats"></div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="winLook">Bekijk het bord</button><button class="btn gold" id="winNext">Volgende zaak</button></div>
</div></div>
<div id="loader"><div class="sigil"></div><div class="t">Moord in de burcht</div><div id="loadTxt">De burcht wordt gebouwd…</div></div>

<script id="core">
// ---------- shared core: runs in the page and in the worker ----------
const DIFF={
  easy:  {N:6,K:4,dens:[.30,.42],mode:'easy'},
  medium:{N:8,K:6,dens:[.34,.46],mode:'medium'},
  hard:  {N:9,K:7,dens:[.36,.48],mode:'hard'}
};
const OCC=new Set(['stoel','paard','bank','tapijt','bed','troon']);
const LEN={tapijt:[1,3],tafel:[1,2],bed:[2,2]};
const UNIQUE=new Set(['troon']);
const ROOMS=[
 {name:'Stal',color:'#e6cfa8',occ:['paard','paard','bank'],blk:['ton','hooibaal','kist']},
 {name:'Binnenplaats',color:'#cfe3b4',occ:['bank','paard'],blk:['boom','struik','put']},
 {name:'Bibliotheek',color:'#c9dcef',occ:['stoel','tapijt'],blk:['boekenkast','boekenkast','tafel']},
 {name:'Slaapkamer',color:'#ddd0ec',occ:['bed','stoel','tapijt'],blk:['kast','kist']},
 {name:'Troonzaal',color:'#f1c9c4',occ:['troon','tapijt','stoel'],blk:['harnas','tafel']},
 {name:'Keuken',color:'#f6e6a8',occ:['stoel','bank'],blk:['tafel','ton','kast']},
 {name:'Kapel',color:'#dcdcdc',occ:['bank','tapijt'],blk:['altaar','kandelaar']},
 {name:'Wapenkamer',color:'#d9c9b6',occ:['stoel','bank'],blk:['harnas','wapenrek','kist']},
 {name:'Tuin',color:'#bfe0c0',occ:['bank'],blk:['boom','struik','bloemperk']},
 {name:'Kelder',color:'#cfc6b8',occ:['stoel'],blk:['ton','wijnrek','kist']}
];
const NAMES={A:[['Adelheid','f'],['Arnoud','m']],B:[['Beatrijs','f'],['Boudewijn','m']],C:[['Clementia','f'],['Coenraad','m']],
 D:[['Dirkje','f'],['Diederik','m']],E:[['Ermgard','f'],['Everard','m']],F:[['Fenna','f'],['Floris','m']],
 G:[['Gerlinde','f'],['Gijsbrecht','m']],H:[['Hadewych','f'],['Hugo','m']]};
const VICTIMS=[['Heer Vranck','m'],['Vrouwe Walburga','f']];
const FACES={f:['👸','👩‍🍳','👵','👩‍🦰','👩‍🌾','🧝‍♀️','👩‍🦳','🧕'],m:['🧔','💂','👨‍🦱','🧙','👨‍🍳','🤵','👴','🧑‍🎤']};

function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];

function makeRegions(r,N,K){
  for(let tries=0;tries<200;tries++){
    const reg=Array(N*N).fill(-1);const sizes=Array(K).fill(0);
    const seeds=shuffle(r,[...Array(N*N).keys()]).slice(0,K);
    seeds.forEach((s,i)=>{reg[s]=i;sizes[i]=1});
    let left=N*N-K,guard=0;
    while(left>0&&guard++<100000){
      // favour small regions so sizes stay balanced
      const order=shuffle(r,[...Array(K).keys()]).sort((a,b)=>sizes[a]-sizes[b]+ (r()-.5)*4);
      const k=order[0];const front=[];
      for(let i=0;i<N*N;i++)if(reg[i]===k){const y=Math.floor(i/N),x=i%N;
        for(const[dy,dx]of D4){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<N&&xx>=0&&xx<N&&reg[yy*N+xx]<0)front.push(yy*N+xx)}}
      if(!front.length){sizes[k]+=1000;continue}
      const c=pick(r,front);reg[c]=k;sizes[k]++;left--;
      for(let j=0;j<K;j++)if(sizes[j]>=1000)sizes[j]-=1000;
    }
    const cnt=Array(K).fill(0);reg.forEach(v=>cnt[v]++);
    if(left===0&&Math.min(...cnt)>=3)return reg;
  }
  return null;
}

function buildMap(r,cfg){
  const N=cfg.N,K=cfg.K;
  const reg=makeRegions(r,N,K);if(!reg)return null;
  const rooms=shuffle(r,ROOMS).slice(0,K);
  const obj=Array(N*N).fill(null),objId=Array(N*N).fill(-1),objs=[];const used=new Set();
  for(let k=0;k<K;k++){
    const cells=[];for(let i=0;i<N*N;i++)if(reg[i]===k)cells.push(i);
    const target=Math.round(cells.length*(cfg.dens[0]+r()*(cfg.dens[1]-cfg.dens[0])));
    let filled=0,guard=0;const room=rooms[k];
    while(filled<target&&guard++<200){
      const wantOcc=r()<0.45;let t=pick(r,wantOcc?room.occ:room.blk);
      if(UNIQUE.has(t)&&used.has(t))continue;
      const [lo,hi]=LEN[t]||[1,1];const len=lo+Math.floor(r()*(hi-lo+1));
      if(filled+len>target+1)continue;
      const s=pick(r,cells);const vert=r()<.5;const cs=[];let ok=true;
      for(let j=0;j<len;j++){const y=Math.floor(s/N)+(vert?j:0),x=s%N+(vert?0:j);
        if(y>=N||x>=N){ok=false;break}const i=y*N+x;if(reg[i]!==k||obj[i]){ok=false;break}cs.push(i)}
      if(!ok)continue;
      const id=objs.length;objs.push({t,cells:cs});cs.forEach(i=>{obj[i]=t;objId[i]=id});used.add(t);filled+=len;
    }
    if(!cells.some(i=>!obj[i]||OCC.has(obj[i])))return null;
  }
  return {N,K,reg,obj,objId,objs,rooms:rooms.map(x=>({name:x.name,color:x.color}))};
}

function geom(M){
  const N=M.N,occ=[];
  for(let i=0;i<N*N;i++)if(!M.obj[i]||OCC.has(M.obj[i]))occ.push(i);
  const nb=i=>{const y=Math.floor(i/N),x=i%N,o=[];for(const[dy,dx]of D4){const yy=y+dy,xx=x+dx;
    if(yy>=0&&yy<N&&xx>=0&&xx<N&&M.reg[yy*N+xx]===M.reg[i])o.push(yy*N+xx)}return o};
  const bord=(i,dy,dx)=>{const y=Math.floor(i/N)+dy,x=i%N+dx;return y<0||y>=N||x<0||x>=N||M.reg[y*N+x]!==M.reg[i]};
  const corner=i=>(bord(i,1,0)||bord(i,-1,0))&&(bord(i,0,1)||bord(i,0,-1));
  const edge=i=>{const y=Math.floor(i/N),x=i%N;return y===0||x===0||y===N-1||x===N-1};
  return {occ,nb,corner,edge};
}

function atomsFor(M,G){
  const A={};const types=new Set(M.obj.filter(Boolean));
  for(const t of types){if(OCC.has(t))A['op:'+t]=i=>M.obj[i]===t;
    A['naast:'+t]=i=>G.nb(i).some(q=>M.obj[q]===t)}
  for(let k=0;k<M.K;k++)A['in:'+k]=i=>M.reg[i]===k;
  A['hoek']=G.corner;A['rand']=G.edge;A['geenobject']=i=>!M.obj[i];A['alleen']=()=>true;
  return A;
}

function countSolutions(M,G,A,people,victim,clues,cap,budget){
  const N=M.N;const cand={};
  for(const n of people){
    if(n===victim){cand[n]=G.occ;continue}
    cand[n]=G.occ.filter(i=>clues[n].every(a=>A[a](i)));
    if(!cand[n].length)return {count:0};
  }
  const order=people.slice().sort((a,b)=>cand[a].length-cand[b].length);
  const alone=people.filter(n=>n!==victim&&clues[n].includes('alleen'));
  const pos={};let count=0,nodes=0,first=null,over=false;
  const regCnt=Array(M.K).fill(0);
  function rec(d,rows,cols){
    if(count>=cap||over)return;
    if(++nodes>budget){over=true;return}
    if(d===order.length){
      if(regCnt[M.reg[pos[victim]]]!==2)return;
      for(const n of alone)if(regCnt[M.reg[pos[n]]]!==1)return;
      count++;if(!first)first=Object.assign({},pos);return;
    }
    const n=order[d];
    for(const i of cand[n]){const y=Math.floor(i/N),x=i%N;
      if(rows>>y&1||cols>>x&1)continue;
      pos[n]=i;regCnt[M.reg[i]]++;rec(d+1,rows|1<<y,cols|1<<x);regCnt[M.reg[i]]--;
      if(count>=cap||over)return;}
  }
  rec(0,0,0);
  return {count:over?cap:count,first,over};
}

function placeSolution(r,M,G){
  const N=M.N;const occSet=new Set(G.occ);
  for(let t=0;t<60;t++){
    const colOf=Array(N);const usedC=new Set();
    const rows=[...Array(N).keys()];
    const go=y=>{if(y===N)return true;for(const x of shuffle(r,[...Array(N).keys()])){
      if(usedC.has(x)||!occSet.has(y*N+x))continue;usedC.add(x);colOf[y]=x;if(go(y+1))return true;usedC.delete(x)}return false};
    if(!go(0))return null;
    const cells=rows.map(y=>y*N+colOf[y]);
    const cnt={};cells.forEach(i=>cnt[M.reg[i]]=(cnt[M.reg[i]]||0)+1);
    const vIdx=shuffle(r,cells.map((_,j)=>j)).find(j=>cnt[M.reg[cells[j]]]===2);
    if(vIdx===undefined)continue;
    return {cells,vIdx};
  }
  return null;
}

function generate(seed,diff){
  const cfg=DIFF[diff];
  for(let att=0;att<400;att++){
    const r=rng(seed*7919+att*104729+13);
    const M=buildMap(r,cfg);if(!M)continue;
    const G=geom(M);const A=atomsFor(M,G);
    const P=placeSolution(r,M,G);if(!P)continue;
    const N=M.N;const letters='ABCDEFGH'.slice(0,N-1).split('');
    const fpool=shuffle(r,FACES.f),mpool=shuffle(r,FACES.m);
    const sus=letters.map(L=>{const [nm,g]=pick(r,NAMES[L]);return {name:nm,g,face:(g==='f'?fpool:mpool).pop()}});
    const [vn,vg]=pick(r,VICTIMS);const vic={name:vn,g:vg,face:vg==='f'?'👸':'🤴',victim:true};
    const others=shuffle(r,P.cells.filter((_,j)=>j!==P.vIdx));
    const sol={};sus.forEach((s,j)=>sol[s.name]=others[j]);sol[vic.name]=P.cells[P.vIdx];
    const people=sus.map(s=>s.name).concat(vic.name);
    const regCnt={};Object.values(sol).forEach(i=>regCnt[M.reg[i]]=(regCnt[M.reg[i]]||0)+1);
    const truth={},strength={};
    for(const a in A)strength[a]=a==='alleen'?G.occ.length*0.6:G.occ.filter(A[a]).length;
    for(const s of sus){const i=sol[s.name];
      truth[s.name]=Object.keys(A).filter(a=>a==='alleen'?regCnt[M.reg[i]]===1:A[a](i)).filter(a=>strength[a]<G.occ.length)}
    const res=chooseClues(r,cfg.mode,M,G,A,people,vic.name,sus,truth,strength);
    if(!res)continue;
    const killer=people.find(n=>n!==vic.name&&M.reg[sol[n]]===M.reg[sol[vic.name]]);
    return {seed,diff,M,sus,vic,sol,clues:res,killer};
  }
  return null;
}

function chooseClues(r,mode,M,G,A,people,victim,sus,truth,strength){
  const names=sus.map(s=>s.name);const BUD=40000;
  const cnt=(cl,cap)=>countSolutions(M,G,A,people,victim,cl,cap,BUD).count;
  const clues={};
  for(const n of names){
    const t=truth[n].slice().sort((a,b)=>strength[a]-strength[b]);
    if(!t.length)return null;
    let pool=mode==='easy'?t.slice(0,Math.max(1,Math.ceil(t.length/3))):t.slice(0,Math.max(1,Math.ceil(t.length*2/3)));
    clues[n]=[pick(r,pool)];
  }
  let c=cnt(clues,60);
  for(let it=0;it<40&&c!==1;it++){
    let best=null;
    for(const n of shuffle(r,names)){
      const opts=truth[n].map(a=>[a]);
      if(clues[n].length===1)truth[n].forEach(a=>{if(a!==clues[n][0])opts.push([clues[n][0],a])});
      for(const o of opts){
        if(o.length===clues[n].length&&o.every((a,j)=>a===clues[n][j]))continue;
        const t=Object.assign({},clues);t[n]=o;const k=cnt(t,c);
        if(k<1||k>=c)continue;
        const weak=o.reduce((s,a)=>s+Math.log(strength[a]+1),0)-(o.length-1)*1.5;
        let score;
        if(mode==='easy')score=[k,-weak*0.01,r()];
                else score=[k,o.length,r()];
        if(!best||cmp(score,best.score)<0)best={score,n,o,k};
      }
    }
    if(!best)return null;
    clues[best.n]=best.o;c=best.k;
  }
  if(c!==1)return null;
  const rounds=mode==='hard'?3:mode==='medium'?1:0;
  for(let rd=0;rd<rounds;rd++){ // loosen clues while the answer stays unique
    for(const n of shuffle(r,names)){
      const alts=truth[n].map(a=>[a]).filter(o=>!(o.length===clues[n].length&&o[0]===clues[n][0]))
        .sort((a,b)=>strength[b[0]]-strength[a[0]]);
      const curW=clues[n].length>1?-1:strength[clues[n][0]];
      for(const o of alts){if(clues[n].length===1&&strength[o[0]]<=curW)break;
        const t=Object.assign({},clues);t[n]=o;if(cnt(t,2)===1){clues[n]=o;break}}
    }
  }
  const fin=countSolutions(M,G,A,people,victim,clues,2,3000000);
  if(fin.over||fin.count!==1)return null;
  return clues;
}
function cmp(a,b){for(let i=0;i<a.length;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1}return 0}
</script>

  const p=cellPos(i);ghost.g.position.set(p.x,baseY(i),p.z)}

function flashCells(cells,color='#ff3b2b'){for(const i of cells){const t=tiles[i];if(!t)continue;const m=t.material;m.emissive.set(color);
  tween(700,k=>m.emissiveIntensity=.5*Math.sin(Math.PI*Math.min(1,k*1.4))*(1-k),()=>{m.emissiveIntensity=0;m.emissive.set('#000')},'fl'+i)}}
function ringAt(i){const p=cellPos(i);hl.position.set(p.x,baseY(i)+.04,p.z);hl.userData.on=true;hl.material.opacity=1;clearTimeout(hl.userData.to);hl.userData.to=setTimeout(()=>hl.userData.on=false,500)}
function conflicts(i,who){const N=P.M.N;return Object.keys(state).filter(n=>n!==who&&(Math.floor(state[n]/N)===Math.floor(i/N)||state[n]%N===i%N))}

function tapCell(i){
  if(showSol||solvedNow)return;ringAt(i);
  const occAt=Object.keys(state).find(n=>state[n]===i);const canStand=geom(P.M).occ.includes(i);
  if(mode==='x'){snap();if(marks[i])delete marks[i];else{marks[i]=1;delete notes[i];if(occAt)delete state[occAt]}}
  else if(mode==='notes'){
    if(!tool){if(occAt){tool=occAt;renderUI();return}nudgePalette('Kies eerst wie je wilt noteren.');return}
    if(occAt){toast(`Hier staat al ${occAt}.`);return}
    if(!canStand){toast('Daar kan niemand staan.','bad');buzz();return}
    snap();const L=letter(tool);const s=notes[i]||'';const t=s.includes(L)?s.replace(L,''):s+L;if(t)notes[i]=t;else delete notes[i];delete marks[i];
    renderUI();save();return}
  else if(!tool){if(occAt){tool=occAt;renderUI();updateGhost();return}nudgePalette('Kies eerst een verdachte hieronder.');return}
  else if(occAt===tool){snap();delete state[tool]}
  else{if(!canStand){toast('Daar kan niemand staan.','bad');buzz();flashCells([i]);return}
    snap();if(occAt)delete state[occAt];const cf=conflicts(i,tool);placeAt(tool,i);
    if(cf.length){const N=P.M.N;toast(`${cf[0]} staat al in deze ${Math.floor(state[cf[0]]/N)===Math.floor(i/N)?'rij':'kolom'}.`,'bad');buzz();flashCells(cf.map(n=>state[n]))}}
  started=true;syncPawns();renderUI();save();updateGhost();checkBoard()}
function buzz(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
function nudgePalette(msg){toast(msg);const p=$('#palette');p.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:280})}

// ---------- game flow ----------
const complete=()=>people().every(n=>state[n]!==undefined);
const correct=()=>people().every(n=>state[n]===P.sol[n]);
let boardWasRight=false;
function checkBoard(){const ok=complete()&&correct();$('#accuseBtn').classList.toggle('ready',ok&&!solved);
  if(ok&&!boardWasRight&&!solved)toast('Het bord klopt. Wie is de moordenaar?','good');
  else if(complete()&&!ok&&!Object.values(pawns).some(p=>p.userData.bad))toast('Iedereen staat, maar er klopt nog iets niet.');
  boardWasRight=ok}
// hints come in two steps: first point at the person with the fewest options, then place them on the second tap
let hintFor=null;const hintRings=[];
function showHintRings(cells){for(const r of hintRings)r.visible=false;cells.forEach((i,k)=>{let r=hintRings[k];
  if(!r){r=new THREE.Mesh(new THREE.RingGeometry(.3,.4,32),new THREE.MeshBasicMaterial({color:'#9fd0ff',transparent:true,depthWrite:false,depthTest:false}));r.rotation.x=-Math.PI/2;r.renderOrder=9;hintRings.push(r)}
  if(r.parent!==world)world.add(r);const p=cellPos(i);r.position.set(p.x,baseY(i)+.05,p.z);r.visible=true})}
function hint(){if(showSol||solvedNow)return;closePops();
  const wrong=people().find(n=>state[n]!==undefined&&state[n]!==P.sol[n]);
  if(wrong){hints++;toast(`${wrong} staat niet goed.`,'bad');tool=wrong;renderUI();showHintRings([state[wrong]]);setTimeout(()=>showHintRings([]),2500);return}
  if(complete()){toast('Alles staat. Wie is de moordenaar?');return}
  if(hintFor&&state[hintFor]===undefined){const n=hintFor;hintFor=null;snap();placeAt(n,P.sol[n]);showHintRings([]);toast(`${n} is geplaatst.`);started=true;syncPawns();renderUI();save();checkBoard();return}
  const G=geom(P.M),A=atomsFor(P.M,G),N=P.M.N;const takenR=new Set(),takenC=new Set();for(const n in state){takenR.add(Math.floor(state[n]/N));takenC.add(state[n]%N)}
  let best=null;for(const n of people()){if(state[n]!==undefined)continue;const cl=n===P.vic.name?[]:P.clues[n];
    const c=G.occ.filter(i=>!takenR.has(Math.floor(i/N))&&!takenC.has(i%N)&&cl.every(a=>A[a](i)));if(!best||c.length<best.c.length)best={n,c}}
  hints++;hintFor=best.n;tool=best.n;renderUI();showHintRings(best.c);
  toast(best.c.length===1?`${best.n} kan nog maar op één plek staan. Zie je waarom? Nog eens 💡 om te plaatsen.`:`Kijk naar ${best.n}: nog ${best.c.length} plekken mogelijk. Druk nog eens op 💡 om te plaatsen.`)}
$('#hintBtn').onclick=hint;

// ---------- UI ----------
let toastT;function toast(t,c=''){const m=$('#toast');m.textContent=t;m.className='glass on '+c;clearTimeout(toastT);toastT=setTimeout(()=>m.classList.remove('on'),Math.max(2600,t.length*55))}
function chip(id,html,label){const b=document.createElement('button');b.className='chip';b.innerHTML=html;b.setAttribute('aria-label',label);b.setAttribute('aria-pressed',tool===id);
  if(state[id]!==undefined)b.classList.add('done');b.onclick=()=>{tool=tool===id?null:id;if(mode==='x')setMode('pen');hintFor=null;showHintRings([]);renderUI();updateGhost()};return b}
function renderUI(){
  const pal=$('#palette');pal.innerHTML='';
  for(const n of people())pal.appendChild(chip(n,`<span class="dot" style="background:${pcolor(n)}">${person(n).face}</span><span class="lt">${letter(n)}</span>`,n));
  const cb=$('#cluebar');
  const tag=mode==='notes'?'<span class="mode-tag">✎ NOTITIE</span>':'';
  if(showSol)cb.innerHTML=`<div class="tx">Dit is de <b>oplossing</b>. ${P.killer} was alleen met ${P.vic.name}.</div>`;
  else if(mode==='x')cb.innerHTML=`<div class="tx">Tik op vakken om ze te <b>schrappen</b>. Nog eens tikken haalt het kruis weg.</div>`;
  else if(tool){const placed=state[tool]!==undefined;cb.innerHTML=`<span class="face">${person(tool).face}</span><div><div class="nm">${tag}${tool.toUpperCase()}</div><div class="tx">${clueText(tool)}</div></div>`}
  else if(mode==='notes')cb.innerHTML=`<div class="tx">${tag}Kies een verdachte en tik op elk vak waar die <b>misschien</b> stond.</div>`;
  else cb.innerHTML=`<div class="tx">Kies een verdachte en tik op een vak. Tik op een pion om die op te pakken.</div>`;
  drawNotes();updateTiles();
  const c=$('#cards');c.innerHTML='';
  for(const n of people()){const s=person(n);const d=document.createElement('div');d.className='card'+(s.victim?' victim':'')+(tool===n?' sel':'');
    d.innerHTML=`${state[n]!==undefined?'<span class="ok">✓</span>':''}<div class="face">${s.face}</div><div class="nm">${n.toUpperCase()}</div><div>${clueText(n)}</div>`;
    d.onclick=()=>{tool=n;if(mode==='x')setMode('pen');renderUI();$('#dossier').classList.remove('open')};c.appendChild(d)}
  $('#undoBtn').disabled=!hist.length||showSol;
  requestAnimationFrame(resize);
}
function renderStatic(){
  $('#caseNo').textContent=`zaak ${P.seed}`;
  const vn=P.vic.name.replace(/^(\w)/,c=>c.toUpperCase());
  $('#title').textContent=`Zaak ${P.seed}: moord op ${vn}`;$('#sub').textContent=SUBS[P.seed%SUBS.length];
  const types=[...new Set(P.M.obj.filter(Boolean))];
  $('#legend').innerHTML=`<div class="y"><h4>KUNNEN WORDEN BEZET</h4>${types.filter(t=>OCC.has(t)).map(t=>LABEL[t]).join(', ')}</div><div class="n"><h4>KUNNEN NIET WORDEN BEZET</h4>${types.filter(t=>!OCC.has(t)).map(t=>LABEL[t]).join(', ')}</div>`;
  $('#rules').innerHTML=`<li>Iedere persoon staat in een eigen <b>rij</b> en een eigen <b>kolom</b>.</li>
<li>Je staat op een lege tegel of op een object dat bezet kan worden: stoel, bank, bed, tapijt, troon of paard.</li>
<li><b>Naast</b> betekent direct ervoor, erachter, links of rechts, <b>in hetzelfde gebied</b>. Muren scheiden de gebieden.</li>
<li>Een <b>hoek van een gebied</b> is een vak waar twee muren van dat gebied samenkomen. De buitenmuur telt mee.</li>
<li><b>Alleen</b> betekent: niemand anders in hetzelfde gebied.</li>
<li>Het slachtoffer was alleen met de moordenaar.</li>`;
  $('#printLink').href=`../#${P.diff}-${P.seed}`;
  document.querySelectorAll('#newMenu .diff').forEach(b=>b.setAttribute('aria-current',b.dataset.d===P.diff));
}
function renderSuspects(){$('#susList').innerHTML=P.sus.map(s=>`<button data-n="${s.name}" class="${wrongAcc.includes(s.name)?'no':''}"><span>${s.face}</span>${s.name}</button>`).join('');
  document.querySelectorAll('#susList button').forEach(b=>b.onclick=()=>accuse(b.dataset.n))}

function closePops(){$('#more').classList.remove('on');$('#newMenu').classList.remove('on');$('#moreBtn').setAttribute('aria-expanded',false);$('#newBtn').setAttribute('aria-expanded',false)}
function togglePop(id,btn){const m=$(id);const on=!m.classList.contains('on');closePops();m.classList.toggle('on',on);$(btn).setAttribute('aria-expanded',on)}
$('#dossBtn').onclick=()=>$('#dossier').classList.add('open');
$('#closeDoss').onclick=()=>$('#dossier').classList.remove('open');
$('#moreBtn').onclick=e=>{e.stopPropagation();togglePop('#more','#moreBtn')};
$('#newBtn').onclick=e=>{e.stopPropagation();togglePop('#newMenu','#newBtn')};
document.addEventListener('click',e=>{if(!e.target.closest('.pop')&&!e.target.closest('#moreBtn,#newBtn'))closePops()});
$('#more').addEventListener('click',e=>{if(e.target.closest('button'))setTimeout(closePops,0)});
document.querySelectorAll('#newMenu .diff').forEach(b=>b.onclick=()=>{closePops();diff=b.dataset.d;newCase()});
$('#clearNotesBtn').onclick=()=>{if(!Object.keys(notes).length){toast('Er zijn geen notities.');return}snap();notes={};renderUI();save();toast('Notities gewist. ↶ zet ze terug.')};
$('#clearBtn').onclick=()=>{if(!Object.keys(state).length&&!Object.keys(marks).length&&!Object.keys(notes).length){toast('Het bord is al leeg.');return}
  snap();state={};marks={};notes={};if(showSol)toggleSol();syncPawns();renderUI();save();checkBoard();toast('Bord gewist. ↶ zet het terug.')};
function toggleSol(){if(solvedNow)return;showSol=!showSol;$('#solveBtn').textContent=showSol?'Verberg oplossing':'Oplossing';tool=null;syncPawns();renderUI();
  if(showSol){if(!solved)revealedSol=true;setTop(false);toast(`${P.killer} was alleen met ${P.vic.name} in de ${P.M.rooms[P.M.reg[P.sol[P.vic.name]]].name.toLowerCase()}.`)}}
let revealedSol=false;
$('#solveBtn').onclick=toggleSol;
function openAccuse(){if(showSol){toast('Verberg eerst de oplossing.');return}
  $('#accuseSub').textContent=complete()?(correct()?'Het bord is compleet. Wijs de dader aan.':'Weet je het zeker? Het bord klopt nog niet helemaal.'):`Nog ${people().filter(n=>state[n]===undefined).length} personen te plaatsen. Je mag gokken, maar bewijs is beter.`;
  renderSuspects();$('#accuse').classList.add('on')}
$('#accuseBtn').onclick=openAccuse;
$('#accuseCancel').onclick=()=>$('#accuse').classList.remove('on');
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m&&m.id!=='win')m.classList.remove('on')}));
function accuse(n){$('#accuse').classList.remove('on');
  if(n!==P.killer){if(!wrongAcc.includes(n))wrongAcc.push(n);save();toast(`${n} heeft een alibi. Kijk nog eens naar het bord.`,'bad');buzz();return}
  if(!complete()||!correct()){toast(`Goed gegokt, maar het bord bewijst het nog niet. Maak het af!`);return}
  win()}
// the reveal: lock the board, tip the victim over, light the killer, fly in, then the verdict
function win(){$('#toast').classList.remove('on');solved=true;solvedNow=true;tool=null;closePops();$('#accuseBtn').classList.remove('ready');$('#timer').classList.add('solved');
  try{localStorage.setItem('murdoku2:solved:'+P.diff+':'+P.seed,JSON.stringify({t:elapsed,hints,wrong:wrongAcc.length,peek:revealedSol}))}catch(e){}
  syncPawns();renderUI();const v=cellPos(state[P.vic.name]),k=cellPos(state[P.killer]);
  flyTo(false,1600,false,v.clone().lerp(k,.5));
  for(const n in pawns)if(n!==P.killer&&n!==P.vic.name){const pw=pawns[n];tween(600,t=>pw.userData.m.color.set(pcolor(n)).lerp(new THREE.Color('#333'),t*.6))}
  setTimeout(()=>{confetti();showWin()},1500)}
function showWin(){const s=person(P.killer);
  $('#winTxt').innerHTML=`<span style="font-size:34px;font-style:normal">${s.face}</span><br>${P.killer} was alleen met ${P.vic.name} in de ${P.M.rooms[P.M.reg[P.sol[P.vic.name]]].name.toLowerCase()}.`;
  const lvl={easy:'Makkelijk',medium:'Normaal',hard:'Moeilijk'}[P.diff];
  $('#winStats').innerHTML=`<div><b>${fmtTime(elapsed)}</b><small>tijd</small></div><div><b>${hints}</b><small>hints</small></div><div><b>${wrongAcc.length}</b><small>missers</small></div><div><b>${lvl}</b><small>niveau</small></div>`;
  $('#win').classList.add('on')}
$('#winNext').onclick=()=>{$('#win').classList.remove('on');newCase()};
$('#winLook').onclick=()=>{$('#win').classList.remove('on');controls.enabled=true};
function confetti(){const cols=['#e8c272','#e0503c','#3d8bfd','#2fbf71','#ffffff'];const g=new THREE.Group();world.add(g);const parts=[];const geo=new THREE.PlaneGeometry(.08,.14);
  const mats=cols.map(c=>new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));
  for(let i=0;i<180;i++){const m=new THREE.Mesh(geo,mats[i%5]);
    m.position.set((Math.random()-.5)*P.M.N,4+Math.random()*3,(Math.random()-.5)*P.M.N);m.userData.v=new THREE.Vector3((Math.random()-.5)*.02,-.02-Math.random()*.03,(Math.random()-.5)*.02);
    m.userData.r=new THREE.Vector3(Math.random()*.2,Math.random()*.2,Math.random()*.2);g.add(m);parts.push(m)}
  tween(5000,()=>{for(const m of parts){m.position.add(m.userData.v);m.rotation.x+=m.userData.r.x;m.rotation.y+=m.userData.r.y;m.position.x+=Math.sin(m.position.y*3)*.004}},()=>world.remove(g))}

function save(){if(!P)return;try{localStorage.setItem('murdoku2:'+P.diff+':'+P.seed,JSON.stringify({state,marks,notes,t:elapsed,hints,wrong:wrongAcc,peek:revealedSol}));localStorage.setItem('murdoku2:last',location.hash)}catch(e){}}
setInterval(()=>{if(P&&started&&!solved)save()},5000);
addEventListener('pagehide',save);
function load(){try{const s=JSON.parse(localStorage.getItem('murdoku2:'+P.diff+':'+P.seed)||'null');if(s){state=s.state||{};marks=s.marks||{};notes=s.notes||{};elapsed=s.t||0;hints=s.hints||0;wrongAcc=s.wrong||[];revealedSol=!!s.peek}
  solved=!!localStorage.getItem('murdoku2:solved:'+P.diff+':'+P.seed)}catch(e){}}

let worker=null;
function makeWorker(){try{const src=document.getElementById('core').textContent+`;onmessage=e=>postMessage(generate(e.data.seed,e.data.diff))`;
  return new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})))}catch(e){return null}}
function genAsync(seed,d){return new Promise(res=>{if(worker===null)worker=makeWorker()||false;
  if(!worker){setTimeout(()=>res(generate(seed,d)),30);return}let done=false;
  worker.onmessage=e=>{done=true;res(e.data)};worker.onerror=()=>{if(done)return;done=true;worker=false;res(generate(seed,d))};worker.postMessage({seed,diff:d})})}
const fontsReady=document.fonts?Promise.race([Promise.all([document.fonts.load('800 40px Cinzel'),document.fonts.load('400 16px "EB Garamond"')]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
let opening=false;
async function openCase(seed,d){if(opening)return;opening=true;
  $('#loader').classList.remove('off');$('#loadTxt').textContent='Een nieuwe moord wordt beraamd…';$('#win').classList.remove('on');
  let g=null;for(let k=0;k<5&&!g;k++){g=await genAsync(seed,d);if(!g)seed++}
  await fontsReady;opening=false;
  if(!g){$('#loader').classList.add('off');toast('Dat lukte niet. Probeer opnieuw.','bad');return}
  P=g;diff=d;state={};marks={};notes={};hist.length=0;showSol=false;tool=null;hintFor=null;elapsed=0;lastSec=-1;hints=0;wrongAcc=[];solved=false;solvedNow=false;revealedSol=false;boardWasRight=false;
  $('#solveBtn').textContent='Oplossing';
  history.replaceState(null,'',`#${d}-${seed}`);load();started=Object.keys(state).length>0;
  for(const r of hintRings)r.visible=false;if(ghost){ghost=null}
  buildWorld();renderStatic();mode='';setMode('pen');syncPawns(false);resize();save();
  $('#timer').textContent=fmtTime(elapsed);$('#timer').classList.toggle('solved',solved);
  boardWasRight=complete()&&correct();$('#accuseBtn').classList.toggle('ready',boardWasRight&&!solved);
  $('#loader').classList.add('off');topView=false;$('#camBtn').textContent='Boven';flyTo(false,2200,true);
  if(solved)setTimeout(()=>toast('Deze zaak heb je al opgelost. Kies gerust een nieuwe.','good'),2300);
  else if(!localStorage.getItem('murdoku2:seen')){try{localStorage.setItem('murdoku2:seen','1')}catch(e){}
    setTimeout(()=>{if(innerWidth<900)$('#dossier').classList.add('open');else toast('Lees de aanwijzingen links en zet iedereen op de goede plek.')},2300)}
}
function newCase(){openCase(1+Math.floor(Math.random()*99999),diff)}
function fromHash(){const m=/^#(easy|medium|hard)-(\d+)$/.exec(location.hash);if(m){openCase(+m[2],m[1]);return true}return false}
addEventListener('hashchange',()=>{if(!P||location.hash!==`#${P.diff}-${P.seed}`)fromHash()});
camera.position.set(0,20,20);resize();loop();
if(!fromHash()){let last=null;try{last=localStorage.getItem('murdoku2:last')}catch(e){}
  if(last&&/^#(easy|medium|hard)-\d+$/.test(last))location.hash=last,fromHash();else openCase(75,'medium')}
addEventListener('keydown',e=>{if(!P||e.target.closest('select,input,textarea'))return;const k=e.key.toUpperCase();
  if(k==='ESCAPE'){if($('#accuse').classList.contains('on')){$('#accuse').classList.remove('on');return}if($('#dossier').classList.contains('open')){$('#dossier').classList.remove('open');return}closePops();tool=null;renderUI();updateGhost();return}
  if(document.querySelector('.modal.on'))return;
  if((e.metaKey||e.ctrlKey)&&k==='Z'){e.preventDefault();undo();return}if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(k==='Z')undo();else if(k==='N')setMode(mode==='notes'?'pen':'notes');else if(k==='X')setMode(mode==='x'?'pen':'x');
  else if(k==='H')hint();else if(k==='C')setTop(!topView);
  else{const n=byLetter(k);if(!n)return;tool=tool===n?null:n;if(mode==='x')setMode('pen');hintFor=null;showHintRings([]);renderUI();updateGhost()}});
window.__dbg={get P(){return P},tapCell,setMode,get notes(){return notes},get state(){return state},get pawns(){return pawns},camera,renderer,get tool(){return tool},set tool(v){tool=v;renderUI()},hint,
  cellScreen:i=>{const v=cellPos(i);v.y=baseY(i)+.05;v.project(camera);const r=canvas.getBoundingClientRect();return {x:(v.x+1)/2*r.width+r.left,y:(1-v.y)/2*r.height+r.top}},
  get busy(){return tweens.length},get mode(){return mode},get solved(){return solved},
  info:()=>({calls:renderer.info.render.calls,tris:renderer.info.render.triangles,geos:renderer.info.memory.geometries})};
</script>
